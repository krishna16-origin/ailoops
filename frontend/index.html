    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension/lib/index.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>

    <script>
        if (typeof marked !== 'undefined' && typeof markedKatex !== 'undefined') {
            try {
                marked.use(markedKatex({ throwOnError: false }));
            } catch (e) {
                console.warn('Math rendering extension failed to initialize:', e);
            }
        } else {
            console.warn('marked.js or its KaTeX extension failed to load from the CDN — math rendering will be disabled, but the rest of the app will still work.');
        }

        // marked-katex-extension only recognizes $...$ and $$...$$ delimiters.
        // A lot of model output uses the LaTeX-style \( ... \) and \[ ... \]
        // delimiters instead, which silently fail to render without this.
        // Converting them to $ / $$ before handing text to marked() fixes that.
        function normalizeMathDelimiters(text) {
            if (!text) return text;
            return text
                .replace(/\\\[([\s\S]*?)\\\]/g, (_, expr) => `$$${expr}$$`)
                .replace(/\\\(([\s\S]*?)\\\)/g, (_, expr) => `$${expr}$`);
        }

        // Nexus-spark indicator (replaces the old 8-petal flower). Shown wherever
        // the old blinking text cursor used to appear while a response streams.
        // Used identically by both Chat mode and Code mode.
        //
        // This is a DOM-node factory, not a plain string, because the indicator
        // now needs to survive being reclassed between "thinking" and "listening"
        // mid-turn (see the assistant_message handler below) — if it were baked
        // into the HTML string that setProse() re-parses on every streamed token,
        // its CSS animation would restart from frame 0 on every single token.
        // Gradient/filter ids get a unique suffix per instance so two indicators
        // (e.g. an old one mid-removal, a new one for the next turn) never clash.
        let thinkingIndicatorInstanceCount = 0;
        function createThinkingIndicator(state) {
            thinkingIndicatorInstanceCount++;
            const uid = `ti${thinkingIndicatorInstanceCount}`;
            const wrapper = document.createElement('span');
            wrapper.className = 'thinking-indicator';
            wrapper.innerHTML = `<div class="logo-container state-${state}">
        <svg class="ai-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="grad-primary-${uid}" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#8b5cf6" />
                    <stop offset="50%" stop-color="#6366f1" />
                    <stop offset="100%" stop-color="#06b6d4" />
                </linearGradient>
                <linearGradient id="grad-secondary-${uid}" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ec4899" />
                    <stop offset="50%" stop-color="#f43f5e" />
                    <stop offset="100%" stop-color="#f59e0b" />
                </linearGradient>
                <filter id="glow-${uid}" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>
            <circle cx="50" cy="50" r="35" fill="url(#grad-primary-${uid})" opacity="0.1" filter="blur(10px)" class="core-dot"/>
            <g class="spark-group spark-secondary">
                <path d="M 50 12 Q 50 50 88 50 Q 50 50 50 88 Q 50 50 12 50 Q 50 50 50 12 Z"
                      fill="none" stroke="url(#grad-secondary-${uid})" stroke-width="1.5" opacity="0.8" />
                <path d="M 50 15 Q 50 50 85 50 Q 50 50 50 85 Q 50 50 15 50 Q 50 50 50 15 Z"
                      fill="url(#grad-secondary-${uid})" opacity="0.3" style="mix-blend-mode: screen;" />
            </g>
            <g class="spark-group spark-primary">
                <path d="M 50 5 Q 50 50 95 50 Q 50 50 50 95 Q 50 50 5 50 Q 50 50 50 5 Z"
                      fill="url(#grad-primary-${uid})" filter="url(#glow-${uid})" opacity="0.9" />
                <path d="M 50 15 Q 50 50 85 50 Q 50 50 50 85 Q 50 50 15 50 Q 50 50 50 15 Z"
                      fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.5" />
            </g>
            <circle cx="50" cy="50" r="4.5" fill="#ffffff" class="core-dot" filter="url(#glow-${uid})" />
        </svg>
    </div>`;
            return wrapper;
        }

        // Small version of the same Nexus-spark logo, running the "thinking" spin
        // (exact same keyframes/colors as think-spin-primary/secondary/core below),
        // sized to sit inside the round .assistant-avatar slot next to each
        // assistant message — replaces the old plain box-outline icon.
        function createAvatarLogo() {
            thinkingIndicatorInstanceCount++;
            const uid = `av${thinkingIndicatorInstanceCount}`;
            const avatar = document.createElement('div');
            avatar.className = 'assistant-avatar';
            avatar.innerHTML = `<div class="logo-container state-thinking">
        <svg class="ai-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="grad-primary-${uid}" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#8b5cf6" />
                    <stop offset="50%" stop-color="#6366f1" />
                    <stop offset="100%" stop-color="#06b6d4" />
                </linearGradient>
                <linearGradient id="grad-secondary-${uid}" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ec4899" />
                    <stop offset="50%" stop-color="#f43f5e" />
                    <stop offset="100%" stop-color="#f59e0b" />
                </linearGradient>
                <filter id="glow-${uid}" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>
            <circle cx="50" cy="50" r="35" fill="url(#grad-primary-${uid})" opacity="0.1" filter="blur(10px)" class="core-dot"/>
            <g class="spark-group spark-secondary">
                <path d="M 50 12 Q 50 50 88 50 Q 50 50 50 88 Q 50 50 12 50 Q 50 50 50 12 Z"
                      fill="none" stroke="url(#grad-secondary-${uid})" stroke-width="1.5" opacity="0.8" />
                <path d="M 50 15 Q 50 50 85 50 Q 50 50 50 85 Q 50 50 15 50 Q 50 50 50 15 Z"
                      fill="url(#grad-secondary-${uid})" opacity="0.3" style="mix-blend-mode: screen;" />
            </g>
            <g class="spark-group spark-primary">
                <path d="M 50 5 Q 50 50 95 50 Q 50 50 50 95 Q 50 50 5 50 Q 50 50 50 5 Z"
                      fill="url(#grad-primary-${uid})" filter="url(#glow-${uid})" opacity="0.9" />
                <path d="M 50 15 Q 50 50 85 50 Q 50 50 50 85 Q 50 50 15 50 Q 50 50 50 15 Z"
                      fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.5" />
            </g>
            <circle cx="50" cy="50" r="4.5" fill="#ffffff" class="core-dot" filter="url(#glow-${uid})" />
        </svg>
    </div>`;
            return avatar;
        }

        // Switches an existing indicator node's state in place (rather than
        // recreating it) so the CSS transitions already defined on .spark-group /
        // .core-dot / .ai-svg (0.5s) actually get to play between states.
        function setThinkingIndicatorState(indicatorEl, state) {
            const logo = indicatorEl && indicatorEl.querySelector('.logo-container');
            if (!logo) return;
            logo.classList.remove('state-thinking', 'state-listening');
            logo.classList.add(`state-${state}`);
        }

        // Maps a language to whatever markup is needed to actually see something
        // rendered in a sandboxed iframe. Used only for Code Mode "show_preview" results.
        function buildPreviewDoc(language, code) {
            const lang = (language || '').trim().toLowerCase();
            const safeCode = code || '';

            if (lang.includes('html')) {
                return safeCode;
            }
            if (lang.includes('css')) {
                return `<!DOCTYPE html><html><head><style>${safeCode}</style></head><body style="font-family:sans-serif;padding:20px;"><h1>Heading</h1><p>Sample paragraph text to preview your CSS against.</p><button>Sample Button</button></body></html>`;
            }
            if (lang.includes('jsx') || lang.includes('tsx') || lang.includes('react')) {
                return `<!DOCTYPE html><html><head>
                    <script src="https://unpkg.com/react@18/umd/react.development.js"><\/script>
                    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"><\/script>
                    <script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
                </head><body><div id="root"></div>
                <script type="text/babel">
                    ${safeCode}
                    try {
                        const rootEl = document.getElementById('root');
                        const Comp = typeof App !== 'undefined' ? App : (typeof default1 !== 'undefined' ? default1 : null);
                        if (Comp) { ReactDOM.createRoot(rootEl).render(React.createElement(Comp)); }
                    } catch (e) { document.getElementById('root').innerText = 'Preview error: ' + e.message; }
                <\/script></body></html>`;
            }
            // Plain JS or anything else frontend-ish: run inside a minimal page.
            return `<!DOCTYPE html><html><body>
                <script>${safeCode}<\/script>
            </body></html>`;
        }

        function highlightCode(el) {
            el.querySelectorAll('pre code').forEach(codeEl => {
                hljs.highlightElement(codeEl);
                const pre = codeEl.parentElement;
                if (pre.parentElement.classList.contains('code-card')) return;

                const langClass = [...codeEl.classList].find(c => c.startsWith('language-'));
                const lang = langClass ? langClass.replace('language-', '') : 'text';
                const isSvg = lang === 'svg' || codeEl.textContent.trim().startsWith('<svg');

                const card = document.createElement('div');
                card.className = 'code-card';
                card.dataset.lang = lang;
                const header = document.createElement('div');
                header.className = 'code-card-header';

                const copyBtnHtml = `
                    <button class="copy-btn" type="button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        <span>Copy</span>
                    </button>
                `;

                let previewDiv = null;

                if (isSvg) {
                    header.innerHTML = `
                        <div class="artifact-tabs">
                            <button class="artifact-tab active" type="button" data-tab="preview">Preview</button>
                            <button class="artifact-tab" type="button" data-tab="code">Code</button>
                        </div>
                        ${copyBtnHtml}
                    `;
                    previewDiv = document.createElement('div');
                    previewDiv.className = 'artifact-preview';
                    previewDiv.innerHTML = DOMPurify.sanitize(codeEl.textContent, { USE_PROFILES: { svg: true, svgFilters: true } });
                    pre.hidden = true;

                    const tabs = header.querySelectorAll('.artifact-tab');
                    tabs.forEach(tab => {
                        tab.addEventListener('click', () => {
                            tabs.forEach(t => t.classList.remove('active'));
                            tab.classList.add('active');
                            const showPreview = tab.dataset.tab === 'preview';
                            previewDiv.hidden = !showPreview;
                            pre.hidden = showPreview;
                        });
                    });
                } else {
                    header.innerHTML = `<span class="code-card-lang">${lang}</span>${copyBtnHtml}`;
                }

                const copyBtn = header.querySelector('.copy-btn');
                const copyLabel = copyBtn.querySelector('span');
                copyBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(codeEl.textContent);
                    copyLabel.textContent = 'Copied!';
                    setTimeout(() => { copyLabel.textContent = 'Copy'; }, 1500);
                });

                pre.parentNode.insertBefore(card, pre);
                card.appendChild(header);
                if (previewDiv) card.appendChild(previewDiv);
                card.appendChild(pre);
            });
        }

        // ================= INLINE CODE STATUS (chat-visible, status only — never shows code) =================
        // Renders directly inside the assistant's message bubble, as a sibling of .message-prose,
        // so re-rendering the prose on every streamed token never wipes it out. Names whichever
        // file is currently being written, with a pulsing dot — the actual code is never shown
        // here, only in the canvas panel. Replaced by the artifact chip once generation finishes.
        function startInlineCodeStatus(container, language, filename) {
            const chip = document.createElement('div');
            chip.className = 'inline-code-status';
            chip.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                <span class="inline-code-status-filename">Writing ${escapeHtml(filename || friendlyLangLabel(language) || 'code')}…</span>
                <span class="inline-code-status-dot"></span>
            `;
            container.appendChild(chip);
            return chip;
        }

        // Called on code_file_start for every file after the first, in a multi-file build —
        // updates which filename the status line names, without ever creating a second chip.
        function updateInlineCodeStatus(chip, language, filename) {
            if (!chip) return;
            const label = chip.querySelector('.inline-code-status-filename');
            if (label) label.textContent = `Writing ${filename || friendlyLangLabel(language) || 'code'}…`;
        }

        // Called once the whole response is done — just removes the live status chip. Nothing
        // about the finished code is rendered here; appendArtifactChip() takes over.
        function removeInlineCodeStatus(chip) {
            if (chip) chip.remove();
        }

        // ================= CODE CANVAS =================
        // Everything below only runs when Code mode calls updateCodeCanvas(). Tracks every file
        // a build produces in modes.code.canvas.files (keyed by filename, ordered via .order),
        // not just the last one written, with a tab strip to switch between them — this is what
        // makes a multi-file build behave like Claude's own multi-file artifacts instead of each
        // new file silently overwriting the last.

        function friendlyLangLabel(language) {
            const lang = (language || '').trim();
            if (!lang) return 'Code';
            const known = { html: 'HTML', css: 'CSS', javascript: 'JavaScript', js: 'JavaScript', jsx: 'JSX', tsx: 'TSX', json: 'JSON', python: 'Python', py: 'Python' };
            return known[lang.toLowerCase()] || (lang.charAt(0).toUpperCase() + lang.slice(1));
        }

        function fileExtensionFor(language) {
            const map = { html: 'html', css: 'css', javascript: 'js', js: 'js', jsx: 'jsx', tsx: 'tsx', typescript: 'ts', python: 'py', py: 'py', json: 'json' };
            return map[(language || '').trim().toLowerCase()] || 'txt';
        }

        // Whether a given file can be rendered live in the preview iframe (buildPreviewDoc
        // supports html/css/jsx/tsx/plain-js) — checked per file, so in a multi-file build a
        // stylesheet or script tab simply has no Preview button while the HTML tab does.
        function fileCanPreview(filename, language) {
            const previewable = ['html', 'htm', 'css', 'jsx', 'tsx', 'js', 'javascript', 'react'];
            const lang = (language || '').trim().toLowerCase();
            const ext = (filename || '').split('.').pop().trim().toLowerCase();
            return previewable.includes(lang) || previewable.includes(ext);
        }

        function renderCanvasFileTabs() {
            const state = modes.code.canvas;
            const bar = document.getElementById('canvasFileTabs');
            if (!state || state.order.length <= 1) { bar.hidden = true; bar.innerHTML = ''; return; }
            bar.hidden = false;
            bar.innerHTML = state.order.map(key => {
                const file = state.files[key];
                const label = file.filename || friendlyLangLabel(file.language);
                const isBeingWritten = streamingActive && key === state.liveFile;
                return `<button type="button" class="canvas-file-tab${key === state.activeFile ? ' active' : ''}" data-file="${escapeHtml(key)}">` +
                    `${escapeHtml(label)}${isBeingWritten ? '<span class="canvas-file-tab-dot"></span>' : ''}</button>`;
            }).join('');
            bar.querySelectorAll('.canvas-file-tab').forEach(btn => {
                btn.addEventListener('click', () => setActiveCanvasFile(btn.dataset.file));
            });
        }

        function setActiveCanvasFile(key) {
            const state = modes.code.canvas;
            if (!state || !state.files[key]) return;
            state.activeFile = key;
            state.tab = 'code';
            renderCodeCanvas();
        }

        // Live-fills the code canvas as code_delta events arrive, the same way the thinking
        // panel fills token-by-token — never touches the chat bubble. Called once per file, the
        // moment code_start/code_file_start arrives for it; keeps every earlier file's content
        // in state.files instead of discarding it, and auto-follows the tab strip onto whichever
        // file is currently being written, exactly like watching a multi-file artifact get built.
        function startCodeCanvasStream(language, filename) {
            streamingActive = true;
            let state = modes.code.canvas;
            if (!state || !state.files) {
                state = { open: true, files: {}, order: [], activeFile: null, liveFile: null, tab: 'code' };
                modes.code.canvas = state;
            }
            const key = filename || '__single__';
            if (!(key in state.files)) state.order.push(key);
            state.files[key] = { language: language || '', code: '', filename: filename || '' };
            state.activeFile = key;
            state.liveFile = key;

            renderCanvasFileTabs();
            canvasTitle.textContent = filename || friendlyLangLabel(language) || 'Code';
            canvasCodeEl.textContent = '';
            canvasCodeEl.className = `language-${(language || 'plaintext').toLowerCase()}`;
            canvasCodeEl.removeAttribute('data-highlighted');
            document.getElementById('canvasPreviewTabBtn').style.display = 'none'; // no preview until the file is complete
            setCanvasTab('code');
            codeCanvas.hidden = false;
        }

        function appendCodeCanvasStream(delta, filename) {
            if (!delta) return;
            const state = modes.code.canvas;
            if (!state) return;
            const key = filename || '__single__';
            const file = state.files[key];
            if (!file) return;
            file.code += delta;
            if (state.activeFile === key) {
                canvasCodeEl.textContent += delta;
                const view = document.getElementById('canvasCodeView');
                view.scrollTop = view.scrollHeight; // keep the "typewriter" pinned to the latest line
            }
        }

        // Called from Code mode's sendMessage() once the final code_result arrives (streaming)
        // or a non-streaming response with code comes back. `files`/`fileLanguages` are
        // {filename: value} maps for multi-file builds; a single-file result just has
        // language/code instead. Always reconciles the canvas against this authoritative
        // payload, so a dropped or out-of-order delta can never leave it showing something
        // wrong or partial. Stores the result on modes.code and renders it only if Code mode is
        // currently visible.
        function updateCodeCanvas({ language, code, files, fileLanguages, showPreview } = {}) {
            const hasFiles = files && Object.keys(files).length > 0;
            if (!hasFiles && !code) return;
            streamingActive = false;

            const state = { open: true, files: {}, order: [], activeFile: null, liveFile: null, tab: 'code' };
            if (hasFiles) {
                for (const [fname, fcode] of Object.entries(files)) {
                    const flang = (fileLanguages && fileLanguages[fname]) || '';
                    state.files[fname] = { language: flang, code: fcode, filename: fname };
                    state.order.push(fname);
                }
                state.activeFile = state.order[0];
            } else {
                state.files['__single__'] = { language: language || '', code, filename: '', forcePreview: !!showPreview };
                state.order.push('__single__');
                state.activeFile = '__single__';
            }
            modes.code.canvas = state;
            if (currentMode === 'code') renderCodeCanvas();
        }

        function renderCodeCanvas() {
            const state = modes.code.canvas;
            if (!state || !state.open || !state.activeFile) { codeCanvas.hidden = true; return; }
            const file = state.files[state.activeFile];
            if (!file) { codeCanvas.hidden = true; return; }

            renderCanvasFileTabs();

            const canPreview = fileCanPreview(file.filename, file.language) || file.forcePreview;
            canvasTitle.textContent = file.filename || `${friendlyLangLabel(file.language)}${canPreview ? ' Preview' : ''}`;
            canvasCodeEl.textContent = file.code;
            canvasCodeEl.className = `language-${(file.language || 'plaintext').toLowerCase()}`;
            canvasCodeEl.removeAttribute('data-highlighted');
            hljs.highlightElement(canvasCodeEl);

            document.getElementById('canvasPreviewTabBtn').style.display = canPreview ? '' : 'none';
            if (canPreview) {
                canvasPreviewFrame.srcdoc = buildPreviewDoc(file.language, file.code);
            }

            setCanvasTab(canPreview ? state.tab : 'code');
            codeCanvas.hidden = false;
        }

        function setCanvasTab(tab) {
            if (modes.code.canvas) modes.code.canvas.tab = tab;
            document.querySelectorAll('#canvasTabs button').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
            document.getElementById('canvasPreviewView').hidden = tab !== 'preview';
            document.getElementById('canvasCodeView').hidden = tab !== 'code';
        }

        document.querySelectorAll('#canvasTabs button').forEach(btn => {
            btn.addEventListener('click', () => setCanvasTab(btn.dataset.tab));
        });

        document.getElementById('canvasCloseBtn').addEventListener('click', () => {
            if (modes.code.canvas) modes.code.canvas.open = false;
            codeCanvas.hidden = true;
        });

        function activeCanvasFile() {
            const state = modes.code.canvas;
            return state && state.activeFile ? state.files[state.activeFile] : null;
        }

        document.getElementById('canvasDownloadBtn').addEventListener('click', () => {
            const file = activeCanvasFile();
            if (!file || !file.code) return;
            const blob = new Blob([file.code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = file.filename || `code.${fileExtensionFor(file.language)}`;
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('canvasCopyBtn').addEventListener('click', () => {
            const file = activeCanvasFile();
            if (!file || !file.code) return;
            navigator.clipboard.writeText(file.code);
            const btn = document.getElementById('canvasCopyBtn');
            const original = btn.title;
            btn.title = 'Copied!';
            setTimeout(() => { btn.title = original; }, 1200);
        });

        document.getElementById('canvasOpenNewTabBtn').addEventListener('click', () => {
            const file = activeCanvasFile();
            if (!file) return;
            const win = window.open('', '_blank');
            if (!win) return;
            win.document.open();
            win.document.write(buildPreviewDoc(file.language, file.code));
            win.document.close();
        });

        // Removes every fenced code block from Code mode's answer text before it's shown in the
        // chat bubble — the code itself only ever lives in the Canvas panel, the chat bubble just
        // gets the explanation plus a small chip to open it. Multi-file responses assemble one
        // fenced block per file (see app.py's final_response for is_multi builds), so this has
        // to strip ALL of them, not just the first, or every file after the first would still
        // show up as a raw code block in chat.
        function stripCodeFence(text) {
            if (!text) return text;
            return text.replace(/```[\w+#.-]*\n[\s\S]*?```/g, '').trim();
        }

        // Small "open the artifact" chip, shown in place of the removed code block(s). Clicking
        // it (re)opens the Canvas panel — this is the ONLY other way besides auto-open to bring
        // the panel back after the user has closed it with X. Pass either `files` (a
        // {filename: code} map, for multi-file builds) or `language`/`code` for a single file.
        function appendArtifactChip(container, { language, code, files, fileLanguages } = {}) {
            const hasFiles = files && Object.keys(files).length > 0;
            if (!hasFiles && !code) return;
            const chip = document.createElement('div');
            chip.className = 'artifact-chip';
            const entries = hasFiles ? Object.entries(files) : [['__single__', code]];
            const fileCount = entries.length;
            const title = hasFiles ? (fileCount === 1 ? entries[0][0] : 'Generated files') : `code.${fileExtensionFor(language)}`;
            const meta = fileCount === 1 ? '1 file' : `${fileCount} files`;
            chip.innerHTML = `
                <div class="artifact-chip-header">
                    <div class="artifact-chip-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                    </div>
                    <div class="artifact-chip-info">
                        <div class="artifact-chip-title">${escapeHtml(title)}</div>
                        <div class="artifact-chip-meta">${escapeHtml(meta)}</div>
                    </div>
                    <button type="button" class="artifact-chip-btn">Open</button>
                </div>
                <div class="artifact-file-list"></div>
            `;
            const list = chip.querySelector('.artifact-file-list');
            entries.forEach(([filename]) => {
                const row = document.createElement('button');
                row.type = 'button';
                row.className = 'artifact-file-row';
                const fileLanguage = hasFiles ? ((fileLanguages && fileLanguages[filename]) || '') : (language || '');
                row.innerHTML = `<svg class="artifact-file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg><span class="artifact-file-name">${escapeHtml(filename === '__single__' ? title : filename)}</span><span class="artifact-file-language">${escapeHtml(friendlyLangLabel(fileLanguage))}</span>`;
                row.addEventListener('click', (event) => {
                    event.stopPropagation();
                    if (modes.code.canvas) {
                        modes.code.canvas.open = true;
                        if (hasFiles && modes.code.canvas.files[filename]) modes.code.canvas.activeFile = filename;
                    }
                    renderCodeCanvas();
                });
                list.appendChild(row);
            });
            chip.addEventListener('click', () => {
                if (modes.code.canvas) modes.code.canvas.open = true;
                renderCodeCanvas();
            });
            container.appendChild(chip);
        }

        const API_BASE = 'https://ailoops.onrender.com';

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // ---------- Mode state: Chat and Code keep fully independent
        // sessions, transcripts, and opening-scene text. Switching modes
        // just swaps which one is visible; nothing is destroyed. ----------
        const MODE_COPY = {
            chat: { title: 'How can I help?', subtitle: 'Clear answers, one direct pass', placeholder: 'Ask anything...' },
            code: { title: 'What do you want to build?', subtitle: 'Code with reasoning, previewed instantly', placeholder: 'Describe the code you need...' }
        };
        const modes = {
            chat: { sessionId: generateUUID(), html: '', hasMessages: false },
            code: { sessionId: generateUUID(), html: '', hasMessages: false,
                // Canvas is Code-mode-only state: every file the last build produced (keyed
                // by filename, in build order), which one is active/live, which tab is
                // showing, and whether the user has closed the panel. Chat mode has no
                // equivalent and never reads this.
                canvas: { open: false, files: {}, order: [], activeFile: null, liveFile: null, tab: 'code' }
            }
        };
        let currentMode = 'chat';
        let isWaitingForResponse = false;
        // Whether the view should keep auto-scrolling as new content streams in.
        // True as long as the user is at (or near) the bottom; false the instant
        // they scroll up to read something — same as ChatGPT, so a streaming
        // answer never yanks them back down against their will.
        let isPinnedToBottom = true;

        const sidebar = document.getElementById('sidebar');
        const chatContainer = document.getElementById('chatContainer');
        const chatContent = document.getElementById('chatContent');
        const scrollToBottomBtn = document.getElementById('scrollToBottomBtn');
        const openingScene = document.getElementById('openingScene');
        const openingTitle = document.getElementById('openingTitle');
        const openingSubtitle = document.getElementById('openingSubtitle');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const modeToggle = document.getElementById('modeToggle');
        const chatSettings = document.getElementById('chatSettings');
        const codeSettings = document.getElementById('codeSettings');
        const codeCanvas = document.getElementById('codeCanvas');
        const canvasTitle = document.getElementById('canvasTitle');
        const canvasCodeEl = document.getElementById('canvasCode');
        let streamingActive = false; // true while code_delta events are live-filling the canvas
        const canvasPreviewFrame = document.getElementById('canvasPreviewFrame');

        function toggleSidebar() { sidebar.classList.toggle('collapsed'); }

        // ============== MODEL / EFFORT PICKER ==============
        // #modelType / #tempSetting / #codeModel / #codeReasoningLevel (down in the
        // composer, hidden) remain the single source of truth sendMessage() reads —
        // this picker only renders their current state and writes back to them.
        const MODEL_OPTIONS = {
            chat: [
                { value: 'fast', name: 'Horus', desc: 'Fastest for quick answers' },
                { value: 'balanced', name: 'Osiris', desc: 'Most efficient for everyday tasks' },
                { value: 'reasoning', name: 'Amun-Ra', desc: 'For complex requests' }
            ],
            code: [
                { value: 'kimi', name: 'Kimi K2.6', desc: 'Balanced everyday coding' },
                { value: 'glm', name: 'GLM 5.2', desc: 'Alternative model for code tasks' },
                { value: 'kimik2.6', name: 'Kimi K2.6 (Thinking)', desc: 'Larger thinking budget for code' }
            ]
        };

        const LEVEL_OPTIONS = {
            chat: {
                label: 'Thinking',
                desc: 'Choose how much model reasoning budget to use before the direct answer.',
                options: [
                    { value: 'low', label: 'Low' },
                    { value: 'medium', label: 'Medium', isDefault: true },
                    { value: 'high', label: 'High' },
                    { value: 'max', label: 'Max' }
                ]
            },
            code: {
                label: 'Effort',
                desc: 'Higher effort gives the model a larger completion budget.',
                options: [
                    { value: 'low', label: 'Low' },
                    { value: 'medium', label: 'Medium', isDefault: true },
                    { value: 'high', label: 'High' },
                    { value: 'max', label: 'Max' }
                ]
            }
        };

        const CHECK_ICON = '<svg class="picker-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="20 6 9 17 4 12"></polyline></svg>';

        const modelPicker = document.getElementById('modelPicker');
        const modelPickerPanel = document.getElementById('modelPickerPanel');
        const pickerScreenMain = document.getElementById('pickerScreenMain');
        const pickerScreenLevel = document.getElementById('pickerScreenLevel');
        const pickerModelList = document.getElementById('pickerModelList');
        const pickerLevelList = document.getElementById('pickerLevelList');
        const modelPickerLabel = document.getElementById('modelPickerLabel');
        const modelPickerLevel = document.getElementById('modelPickerLevel');

        function activeModelField() { return currentMode === 'code' ? document.getElementById('codeModel') : document.getElementById('modelType'); }
        function activeLevelField() { return currentMode === 'code' ? document.getElementById('codeReasoningLevel') : document.getElementById('tempSetting'); }

        function currentLevelLabel() {
            const cfg = LEVEL_OPTIONS[currentMode];
            const field = activeLevelField();
            const match = cfg.options.find(o => o.value === String(field.value));
            return match ? match.label : cfg.options.find(o => o.isDefault).label;
        }

        function updateModelPickerLabel() {
            const models = MODEL_OPTIONS[currentMode];
            const field = activeModelField();
            const match = models.find(m => m.value === field.value);
            modelPickerLabel.textContent = match ? match.name : models[0].name;
            modelPickerLevel.textContent = currentLevelLabel();
        }

        function renderModelList() {
            const models = MODEL_OPTIONS[currentMode];
            const field = activeModelField();
            pickerModelList.innerHTML = models.map(m => `
                <button type="button" class="picker-row picker-model-row" onclick="selectModel('${m.value}')">
                    <span class="picker-row-text">
                        <span class="picker-row-name">${escapeHtml(m.name)}</span>
                        <span class="picker-row-desc">${escapeHtml(m.desc)}</span>
                    </span>
                    ${field.value === m.value ? CHECK_ICON : ''}
                </button>
            `).join('');
        }

        function renderLevelRowSummary() {
            document.getElementById('pickerLevelLabel').textContent = LEVEL_OPTIONS[currentMode].label;
            document.getElementById('pickerLevelValue').textContent = currentLevelLabel();
        }

        function renderLevelList() {
            const cfg = LEVEL_OPTIONS[currentMode];
            const field = activeLevelField();
            document.getElementById('pickerLevelBackLabel').textContent = cfg.label;
            document.getElementById('pickerLevelDesc').textContent = cfg.desc;
            pickerLevelList.innerHTML = cfg.options.map(o => `
                <button type="button" class="picker-row picker-level-row" onclick="selectLevel('${o.value}')">
                    <span>${escapeHtml(o.label)}${o.isDefault ? '<span class="picker-badge">Default</span>' : ''}</span>
                    ${String(field.value) === o.value ? CHECK_ICON : ''}
                </button>
            `).join('');
        }

        function showMainScreen() {
            pickerScreenLevel.hidden = true;
            pickerScreenMain.hidden = false;
            renderModelList();
            renderLevelRowSummary();
        }

        function showLevelScreen() {
            pickerScreenMain.hidden = true;
            pickerScreenLevel.hidden = false;
            renderLevelList();
        }

        function openModelPicker() {
            modelPickerPanel.hidden = false;
            showMainScreen();
            document.addEventListener('click', handleOutsidePickerClick);
        }

        function closeModelPicker() {
            modelPickerPanel.hidden = true;
            document.removeEventListener('click', handleOutsidePickerClick);
        }

        function handleOutsidePickerClick(e) {
            if (!modelPicker.contains(e.target)) closeModelPicker();
        }

        function toggleModelPicker(e) {
            e.stopPropagation();
            if (modelPickerPanel.hidden) openModelPicker(); else closeModelPicker();
        }

        function selectModel(value) {
            activeModelField().value = value;
            updateModelPickerLabel();
            closeModelPicker();
        }

        function selectLevel(value) {
            activeLevelField().value = value;
            updateModelPickerLabel();
            closeModelPicker();
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
            if (textarea.value === '') textarea.style.height = 'auto';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function refreshOpeningSceneVisibility() {
            const state = modes[currentMode];
            if (state.hasMessages) {
                openingScene.style.display = 'none';
                chatContent.style.display = 'flex';
            } else {
                openingScene.style.display = 'flex';
                chatContent.style.display = 'none';
            }
        }

        function switchMode(mode) {
            if (mode === currentMode || isWaitingForResponse) return;

            // Persist the current mode's transcript before swapping.
            modes[currentMode].html = chatContent.innerHTML;

            currentMode = mode;
            modeToggle.classList.toggle('code-active', mode === 'code');
            modeToggle.querySelectorAll('button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            chatSettings.hidden = mode !== 'chat';
            codeSettings.hidden = mode !== 'code';
            closeModelPicker();
            updateModelPickerLabel();

            // Canvas only ever exists in Code mode: show it if a result is
            // already sitting there (and the user hasn't closed it), otherwise
            // make sure it's hidden. Chat mode always takes this "else" branch.
            if (mode === 'code') { renderCodeCanvas(); } else { codeCanvas.hidden = true; }

            const copy = MODE_COPY[mode];
            openingTitle.style.opacity = 0;
            openingSubtitle.style.opacity = 0;
            setTimeout(() => {
                openingTitle.textContent = copy.title;
                openingSubtitle.textContent = copy.subtitle;
                openingTitle.style.opacity = 1;
                openingSubtitle.style.opacity = 1;
            }, 150);
            userInput.placeholder = copy.placeholder;

            chatContent.classList.add('mode-fade-out');
            setTimeout(() => {
                chatContent.innerHTML = modes[mode].html;
                refreshOpeningSceneVisibility();
                chatContent.classList.remove('mode-fade-out');
                chatContent.classList.add('mode-fade-in');
                scrollToBottom(true);
                setTimeout(() => chatContent.classList.remove('mode-fade-in'), 260);
            }, 150);
        }

        function startNewChat() {
            modes[currentMode].sessionId = generateUUID();
            modes[currentMode].html = '';
            modes[currentMode].hasMessages = false;

            if (currentMode === 'code') {
                modes.code.canvas = { open: false, files: {}, order: [], activeFile: null, liveFile: null, tab: 'code' };
                codeCanvas.hidden = true;
            }

            chatContent.innerHTML = '';
            refreshOpeningSceneVisibility();

            userInput.value = '';
            autoResize(userInput);
            userInput.focus();

            const historyList = document.getElementById('historyList');
            const item = document.createElement('div');
            item.className = 'history-item';
            item.textContent = currentMode === 'code' ? 'New Code Session' : 'New Chat';
            historyList.prepend(item);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function appendMessage(role, text) {
            modes[currentMode].hasMessages = true;
            openingScene.style.display = 'none';
            chatContent.style.display = 'flex';

            const row = document.createElement('div');
            row.className = `message-row ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            if (role === 'assistant') {
                const avatar = createAvatarLogo();

                const body = document.createElement('div');
                body.className = 'assistant-body';

                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-text';
                // Prose lives in its own child so re-rendering it (every streamed token
                // re-runs marked.parse on the whole thing) never wipes out sibling
                // elements appended directly to .message-text — the inline code-stream
                // box and the artifact chip both rely on surviving those re-renders.
                contentDiv.innerHTML = `<div class="message-prose">${text ? marked.parse(normalizeMathDelimiters(text)) : ''}</div>`;
                if (text) highlightCode(contentDiv.querySelector('.message-prose'));

                // Thinking block starts EMPTY and expanded. It is only ever populated
                // with real user-facing progress summaries from the backend,
                // and it stays open + growing until the first actual answer token
                // arrives — exactly like Claude: think first, then answer.
                // Identical wiring is used for both Chat mode and Code mode.
                const statusDiv = document.createElement('div');
                statusDiv.className = 'thinking-block';
                statusDiv.style.display = 'none'; // hidden until we actually get a thought
                statusDiv.innerHTML = `
                    <button type="button" class="thinking-toggle">Thinking</button>
                    <div class="thinking-content expanded"></div>
                `;
                statusDiv.querySelector('.thinking-toggle').addEventListener('click', () => {
                    statusDiv.querySelector('.thinking-content').classList.toggle('expanded');
                });

                body.appendChild(statusDiv);

                // Code Mode only: the Claude-Code-style activity trace — starts empty and
                // hidden, and is only ever populated from real 'activity'/'turn_summary'
                // SSE events (see sendMessage below), never faked client-side.
                if (currentMode === 'code') {
                    const activityDiv = document.createElement('div');
                    activityDiv.className = 'activity-block';
                    activityDiv.style.display = 'none';
                    activityDiv.innerHTML = `
                        <button type="button" class="activity-toggle">
                            <svg class="activity-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            <span class="activity-toggle-label">Working</span>
                        </button>
                        <div class="activity-content expanded"></div>
                    `;
                    activityDiv.querySelector('.activity-toggle').addEventListener('click', () => {
                        activityDiv.querySelector('.activity-content').classList.toggle('expanded');
                    });
                    body.appendChild(activityDiv);
                }

                body.appendChild(contentDiv);
                bubble.appendChild(avatar);
                bubble.appendChild(body);
            } else {
                bubble.innerText = text;
            }

            row.appendChild(bubble);
            chatContent.appendChild(row);
            scrollToBottom(true); // new message = always jump down and re-pin

            return role === 'assistant' ? bubble : null;
        }

        // distance (px) from the true bottom that still counts as "at the bottom" —
        // gives a little slack so a stray sub-pixel scroll doesn't unpin the view
        const SCROLL_BOTTOM_THRESHOLD = 80;

        // Auto-scroll during streaming, but ONLY while the user is already pinned
        // to the bottom. If they've scrolled up — e.g. to re-read something while
        // the thinking/answer keeps streaming in — this becomes a no-op instead of
        // yanking them back down, matching ChatGPT's behavior. Pass force=true for
        // moments that should always jump (sending a message, clicking the button).
        function scrollToBottom(force = false) {
            if (!force && !isPinnedToBottom) return;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            isPinnedToBottom = true;
            scrollToBottomBtn.classList.remove('visible');
        }

        // Wired to the floating jump button.
        function jumpToBottom() {
            scrollToBottom(true);
        }

        // Tracks whether the user has manually scrolled away from the bottom, and
        // shows/hides the floating jump button accordingly.
        chatContainer.addEventListener('scroll', () => {
            const distanceFromBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight;
            isPinnedToBottom = distanceFromBottom <= SCROLL_BOTTOM_THRESHOLD;
            scrollToBottomBtn.classList.toggle('visible', !isPinnedToBottom && modes[currentMode].hasMessages);
        });

        // Updates just the .message-prose child of a message-text container, creating it if
        // needed. Unlike assigning textContainer.innerHTML directly (the old approach), this
        // never touches other children — so an inline-code-stream card appended alongside the
        // prose survives every re-render of the streamed answer text.
        function setProse(container, html) {
            let prose = container.querySelector('.message-prose');
            if (!prose) {
                prose = document.createElement('div');
                prose.className = 'message-prose';
                container.insertBefore(prose, container.firstChild);
            }
            prose.innerHTML = html;
            return prose;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isWaitingForResponse) return;

            const mode = currentMode;
            appendMessage('user', text);
            userInput.value = '';
            autoResize(userInput);
            sendBtn.disabled = true;
            isWaitingForResponse = true;

            let apiUrl, payload, useStream;

            if (mode === 'chat') {
                const modelType = document.getElementById('modelType').value;
                const thinkingLevel = document.getElementById('tempSetting').value;
                useStream = document.getElementById('streamSetting').checked;
                apiUrl = `${API_BASE}/chat`;
                payload = {
                    message: text,
                    session_id: modes.chat.sessionId,
                    model_type: modelType,
                    stream: useStream,
                    temperature: 0.3,
                    thinking_level: thinkingLevel
                };
            } else {
                const codeModel = document.getElementById('codeModel').value;
                const reasoningLevel = document.getElementById('codeReasoningLevel').value;
                useStream = document.getElementById('codeStreamSetting').checked;
                apiUrl = `${API_BASE}/code-chat`;
                payload = {
                    message: text,
                    session_id: modes.code.sessionId,
                    model: codeModel,
                    reasoning_level: reasoningLevel,
                    stream: useStream
                    // No temperature — Code Mode intentionally omits it; backend applies its own default.
                };
            }

            const assistantBubble = appendMessage('assistant', '');
            const textContainer = assistantBubble.querySelector('.message-text');
            const thinkingBlock = assistantBubble.querySelector('.thinking-block');
            const thinkingToggle = thinkingBlock.querySelector('.thinking-toggle');
            const thinkingContent = thinkingBlock.querySelector('.thinking-content');
            const thinkingStartTime = Date.now();

            // Code Mode only: the Claude-Code-style "Edited N files, ran M commands,
            // read a file · K notes" activity trace (null in Chat mode).
            const activityBlock = assistantBubble.querySelector('.activity-block');
            const activityToggle = activityBlock ? activityBlock.querySelector('.activity-toggle') : null;
            const activityLabel = activityBlock ? activityBlock.querySelector('.activity-toggle-label') : null;
            const activityContent = activityBlock ? activityBlock.querySelector('.activity-content') : null;
            const activityCounts = { files: 0, commands: 0, reads: 0, notes: 0 };

            const ACTIVITY_ICONS = {
                edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`,
                create: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>`,
                command: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>`,
                read: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>`,
                note: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>`,
                done: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`,
            };

            // Appends one real, already-happened action (file edit/create, command run,
            // file read, note, or live narration) to the activity trace and refreshes
            // the running header. Called only from real 'activity' SSE events, never
            // synthesized client-side.
            function addActivity(activity) {
                if (!activityBlock) return;
                activityBlock.style.display = 'block';
                activityToggle.classList.add('shimmer');

                if (activity.kind === 'edit' || activity.kind === 'create') activityCounts.files++;
                else if (activity.kind === 'command') activityCounts.commands++;
                else if (activity.kind === 'read') activityCounts.reads++;
                else if (activity.kind === 'note') activityCounts.notes++;

                const row = document.createElement('div');
                let rowHtml;

                if (activity.kind === 'narration') {
                    // The model's own "now let me do X" narration, right before the command
                    // that follows it — a plain muted dot + line, same visual language as
                    // the thinking panel's default bullet, never a boxed icon.
                    row.className = 'activity-row activity-row-narration';
                    rowHtml = `<span class="activity-row-icon"><span class="thought-bullet" style="position:static;"></span></span>` +
                        `<span class="activity-row-label activity-row-status">${escapeHtml(activity.label || '')}</span>`;
                } else if ((activity.kind === 'edit' || activity.kind === 'create') && activity.filename) {
                    // Description-first, like a real diff's subject line — the label IS
                    // what this step actually did (e.g. "Add a default backend URL
                    // constant…"), with the file it touched and its real +/- line counts
                    // trailing after it.
                    row.className = 'activity-row activity-row-edit';
                    const icon = ACTIVITY_ICONS[activity.kind];
                    const add = Math.max(0, activity.additions || 0);
                    const del = Math.max(0, activity.deletions || 0);
                    rowHtml = `<span class="activity-row-icon">${icon}</span>` +
                        `<span class="activity-row-label">${escapeHtml(activity.label || '')}</span>` +
                        `<span class="activity-file-badge">${escapeHtml(activity.filename)}</span>` +
                        `<span class="activity-diff-stat"><span class="activity-diff-add">+${add}</span><span class="activity-diff-del">-${del}</span></span>`;
                } else {
                    row.className = 'activity-row';
                    const icon = ACTIVITY_ICONS[activity.kind] || ACTIVITY_ICONS.note;
                    rowHtml = `<span class="activity-row-icon">${icon}</span>` +
                        `<span class="activity-row-label activity-row-status">${escapeHtml(activity.label || '')}</span>`;
                }
                row.innerHTML = rowHtml;
                activityContent.appendChild(row);

                activityLabel.textContent = activity.kind === 'done' ? (activity.label || 'Presented file') : 'Working';
                scrollToBottom();
            }

            // Called once 'turn_summary' arrives (right before code_result) — replaces the
            // live "Working" header with the settled Claude-Code-style recap line, e.g.
            // "Edited 2 files, ran 2 commands, read a file · 1 note".
            function finalizeActivitySummary(summary) {
                if (!activityBlock || !activityLabel) return;
                activityToggle.classList.remove('shimmer');
                const parts = [];
                if (summary.files_touched > 0) parts.push(`Edited ${summary.files_touched} file${summary.files_touched === 1 ? '' : 's'}`);
                if (summary.commands_run > 0) parts.push(`ran ${summary.commands_run} command${summary.commands_run === 1 ? '' : 's'}`);
                if (summary.files_read > 0) parts.push(summary.files_read === 1 ? 'read a file' : `read ${summary.files_read} files`);
                let text = parts.join(', ');
                if (summary.notes > 0) text += `${text ? ' · ' : ''}${summary.notes} note${summary.notes === 1 ? '' : 's'}`;
                if (text) activityLabel.textContent = text;
                else if (!activityContent.childElementCount) activityBlock.style.display = 'none';
            }

            // Show "Thinking" the instant the request goes out — like Claude.ai — rather
            // than waiting for a real backend status event, which may never arrive for
            // quick replies that skip the planning loop entirely (e.g. "hi").
            thinkingBlock.style.display = 'block';
            thinkingToggle.textContent = 'Thinking';
            thinkingToggle.classList.add('shimmer');

            let thinkingDone = false;      // true once the model has moved on to answering
            let answerStarted = false;     // true once the first answer token has arrived
            let thinkingFinalized = false; // true once "Thought for Ns" has been set for good
            let inlineCodeStatus = null;   // the "Writing <file>…" status chip currently shown in chat (Code Mode) — never shows code itself
            let lastThoughtStep = null;    // step name of the most recently rendered thought bubble
            let lastThoughtContentEl = null; // its .thought-content node, so a repeat 'thinking'
                                              // heartbeat can update it in place instead of piling
                                              // up duplicate "Still working on it..." bubbles

            // Icons mapping for different thought types
            const thoughtIcons = {
                'web': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>`,
                'search': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>`,
                'error': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`,
                'success': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
                'plan': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="M9 16l2 2 4-4"></path></svg>`,
                'default': `<div class="thought-bullet"></div>`
            };

            function getIconForLabel(label, detail) {
                const t = ((label || '') + ' ' + (detail || '')).toLowerCase();
                if (t.includes('plan')) return thoughtIcons['plan'];
                if (t.includes('search')) return thoughtIcons['search'];
                if (t.includes('fetch') || t.includes('web') || t.includes('url') || t.includes('http')) return thoughtIcons['web'];
                if (t.includes('fail') || t.includes('error') || t.includes('unable')) return thoughtIcons['error'];
                if (t.includes('finish') || t.includes('success') || t.includes('complete') || t.includes('done')) return thoughtIcons['success'];
                if (t.includes('writing') || t.includes('code')) return thoughtIcons['plan'];
                return thoughtIcons['default'];
            }

                                        // Real backend progress event for the direct response pass. Reveals the block
            // and keeps it expanded while it grows. Shared by both modes.

            function addThought(label, detail, step) {
                if (thinkingDone) return;
                thinkingBlock.style.display = 'block';
                thinkingToggle.textContent = label || 'Thinking';
                thinkingToggle.classList.add('shimmer');

                // A 'thinking' step is a spinner_tick heartbeat — the backend hasn't
                // finished anything new, it's just cycling the status word so the UI
                // doesn't look frozen while one node call runs long. If the previous
                // bubble was ALSO a heartbeat (no real step landed in between), update
                // that same bubble's text instead of appending another identical
                // "Still working on it..." line — this is exactly how Claude's own
                // status indicator behaves: one line updating in place, not a growing
                // stack of duplicates. A genuinely new step always gets its own bubble.
                if (step === 'thinking' && lastThoughtStep === 'thinking' && lastThoughtContentEl) {
                    lastThoughtContentEl.textContent = detail || label || '';
                    scrollToBottom();
                    return;
                }

                const item = document.createElement('div');
                item.className = 'thought-item';

                const icon = getIconForLabel(label, detail);
                if (icon.includes('svg')) {
                    item.innerHTML = `<div class="thought-icon-wrapper">${icon}</div>`;
                } else {
                    item.innerHTML = icon; // bullet
                }

                const node = document.createElement('span');
                node.className = 'thought-node';
                node.textContent = step || 'backend_node';
                item.appendChild(node);

                const content = document.createElement('div');
                content.className = 'thought-content';
                content.textContent = detail || label || '';
                item.appendChild(content);

                const showMore = document.createElement('button');
                showMore.className = 'show-more-btn';
                showMore.textContent = 'Show more';
                item.appendChild(showMore);

                thinkingContent.appendChild(item);

                setTimeout(() => {
                    if (content.scrollHeight > content.clientHeight) {
                        showMore.style.display = 'block';
                        showMore.onclick = () => {
                            const isExpanded = content.classList.toggle('expanded');
                            showMore.textContent = isExpanded ? 'Show less' : 'Show more';
                        };
                    }
                }, 0);

                lastThoughtStep = step || null;
                lastThoughtContentEl = content;

                scrollToBottom();
            }

            // Called the moment the answer actually starts streaming. Switches the main
            // toggle from a shimmering "Thinking" to a shimmering "Answering" and
            // collapses the thought log, but doesn't settle the final label yet.
            function startAnswering() {
                if (thinkingDone) return;
                thinkingDone = true;
                thinkingToggle.textContent = 'Answering';
                thinkingToggle.classList.add('shimmer');
                thinkingContent.classList.remove('expanded');
            }

            // Called once the response is fully done (stream ended, or non-streaming
            // reply received). Settles the main toggle into "Thought for Ns" and stops
            // the shimmer for good, Claude-style. Same behavior for both modes.
            function finishThinking() {
                if (thinkingFinalized) return;
                thinkingFinalized = true;
                thinkingDone = true;
                const seconds = Math.max(1, Math.round((Date.now() - thinkingStartTime) / 1000));
                thinkingToggle.textContent = `Thought for ${seconds}s`;
                thinkingToggle.classList.remove('shimmer');
                thinkingContent.classList.remove('expanded');
                // Nothing to expand into if no detailed step events ever arrived —
                // drop the (now inert) toggle affordance rather than leave a button
                // that opens onto an empty panel.
                if (!thinkingContent.childElementCount) {
                    thinkingToggle.style.cursor = 'default';
                    thinkingToggle.style.pointerEvents = 'none';
                }
            }

            let assistantFullText = '';
            let codeResult = null; // { code, language, show_preview } — Code Mode only

            // Lives outside .message-prose so setProse() re-parsing the prose HTML
            // on every streamed token never touches it — see createThinkingIndicator.
            let indicatorEl = null;
            setProse(textContainer, '');
            indicatorEl = createThinkingIndicator('thinking');
            textContainer.appendChild(indicatorEl);

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('Network response was not ok');

                if (useStream) {
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });

                        const events = buffer.split('\n\n');
                        buffer = events.pop();

                        for (const event of events) {
                            const line = event.trim();
                            if (!line.startsWith('data:')) continue;

                            const jsonStr = line.slice(5).trim();
                            try {
                                const parsed = JSON.parse(jsonStr);
                                if (parsed.type === 'status') {
                                    addThought(parsed.label, parsed.detail, parsed.step);
                                } else if (parsed.type === 'activity') {
                                    addActivity(parsed);
                                } else if (parsed.type === 'turn_summary') {
                                    finalizeActivitySummary(parsed);
                                } else if (parsed.type === 'code_start') {
                                    startCodeCanvasStream(parsed.language, '');
                                    inlineCodeStatus = startInlineCodeStatus(textContainer, parsed.language, '');
                                } else if (parsed.type === 'code_file_start') {
                                    // Multi-file builds: the canvas keeps every earlier file's
                                    // content (see startCodeCanvasStream) — only the chat status
                                    // chip's label needs to move onto the new filename.
                                    startCodeCanvasStream(parsed.language, parsed.filename);
                                    if (!inlineCodeStatus) inlineCodeStatus = startInlineCodeStatus(textContainer, parsed.language, parsed.filename);
                                    else updateInlineCodeStatus(inlineCodeStatus, parsed.language, parsed.filename);
                                } else if (parsed.type === 'code_delta') {
                                    appendCodeCanvasStream(parsed.delta, parsed.filename);
                                } else if (parsed.type === 'code_result') {
                                    codeResult = parsed;
                                } else if (parsed.type === 'message_reset') {
                                    // Compatibility event: clear the current draft if a server
                                    // explicitly asks the client to reset it.
                                    assistantFullText = '';
                                    setProse(textContainer, '');
                                    if (indicatorEl) indicatorEl.remove();
                                    indicatorEl = createThinkingIndicator('thinking');
                                    textContainer.appendChild(indicatorEl);
                                } else if (parsed.assistant_message) {
                                    if (!answerStarted) {
                                        answerStarted = true;
                                        finishThinking(); // collapse thoughts the instant the answer begins
                                        // First real content token — hand off from "thinking" to
                                        // "listening" on the *same* node so the transition plays.
                                        if (indicatorEl) setThinkingIndicatorState(indicatorEl, 'listening');
                                    }
                                    assistantFullText += parsed.assistant_message;
                                    // In Code mode, never let a fenced code block render inside the
                                    // chat bubble while it's still streaming in — it belongs in the
                                    // code canvas (via code_result below), not typed out as raw text.
                                    const liveText = (mode === 'code') ? stripCodeFence(assistantFullText) : assistantFullText;
                                    setProse(textContainer, marked.parse(normalizeMathDelimiters(liveText)));
                                    if (indicatorEl) textContainer.appendChild(indicatorEl);
                                    scrollToBottom();
                                }
                            } catch (e) {
                                console.error('Failed to parse SSE chunk:', jsonStr, e);
                            }
                        }
                    }

                    const hasCodeResult = codeResult && (codeResult.code || (codeResult.files && Object.keys(codeResult.files).length > 0));
                    if (mode === 'code' && hasCodeResult) {
                        setProse(textContainer, marked.parse(normalizeMathDelimiters(stripCodeFence(assistantFullText))));
                        highlightCode(textContainer);
                        // Generation is done — the live status chip's job is over. The finished
                        // file(s) go to the canvas + artifact chip instead.
                        removeInlineCodeStatus(inlineCodeStatus);
                        appendArtifactChip(textContainer, { language: codeResult.language, code: codeResult.code, files: codeResult.files, fileLanguages: codeResult.file_languages });
                        updateCodeCanvas({ language: codeResult.language, code: codeResult.code, files: codeResult.files, fileLanguages: codeResult.file_languages, showPreview: codeResult.show_preview });
                    } else {
                        removeInlineCodeStatus(inlineCodeStatus);
                        setProse(textContainer, marked.parse(normalizeMathDelimiters(assistantFullText)));
                        highlightCode(textContainer);
                    }

                } else {
                    const data = await response.json();
                    if (Array.isArray(data.thinking_steps)) {
                        data.thinking_steps.forEach(step => addThought(step.label, step.detail, step.step));
                    } else if (data.thinking_summary) {
                        addThought('Thinking', data.thinking_summary, 'summary');
                    }
                    assistantFullText = data.response;
                    const hasCode = data && (data.code || (data.files && Object.keys(data.files).length > 0));
                    if (mode === 'code' && hasCode) {
                        setProse(textContainer, marked.parse(normalizeMathDelimiters(stripCodeFence(assistantFullText))));
                        highlightCode(textContainer);
                        // Non-streaming response: the full code arrives in one shot, so there's
                        // no "live" phase to show — go straight to the chip, as before.
                        appendArtifactChip(textContainer, { language: data.language, code: data.code, files: data.files, fileLanguages: data.file_languages });
                        updateCodeCanvas({ language: data.language, code: data.code, files: data.files, fileLanguages: data.file_languages, showPreview: data.show_preview });
                    } else {
                        setProse(textContainer, marked.parse(normalizeMathDelimiters(assistantFullText)));
                        highlightCode(textContainer);
                    }
                }

                finishThinking(); // no-op if already collapsed when the answer started

            } catch (error) {
                console.error('Error:', error);
                thinkingBlock.remove();
                textContainer.innerHTML = `<span style="color: var(--text-secondary)">Make sure your Python FastAPI backend is running.</span>`;
            } finally {
                sendBtn.disabled = false;
                isWaitingForResponse = false;
                userInput.focus();
                const cursor = textContainer.querySelector('.thinking-indicator');
                if (cursor) cursor.remove();
                modes[mode].html = chatContent.innerHTML;
            }
        }

        window.onload = () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                if (splash) {
                    splash.classList.add('hidden');
                    setTimeout(() => splash.style.display = 'none', 700);
                }
                document.getElementById('userInput').focus();
            }, 2100);
            updateModelPickerLabel();
        };
    </script>
</body>
</html>
