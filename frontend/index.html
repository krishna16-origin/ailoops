<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maximus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        :root { --bg-main:#212121; --bg-sidebar:#171717; --bg-input:#2f2f2f; --bg-hover:#2f2f2f; --text-primary:#ececec; --text-secondary:#b4b4b4; --accent:#10a37f; --border-color:rgba(255,255,255,0.1); --transition-bezier:cubic-bezier(0.2,0.8,0.2,1); }
        * { box-sizing:border-box; margin:0; padding:0; font-family:'Inter',sans-serif; }
        body { background-color:var(--bg-main); color:var(--text-primary); display:flex; height:100vh; overflow:hidden; }

        /* ============== SPLASH SCREEN ============== */
        .splash-screen { position:fixed; inset:0; background-color:var(--bg-main); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.7s var(--transition-bezier), visibility 0.7s; }
        .splash-screen.hidden { opacity:0; visibility:hidden; }

        /* Soft ambient color wash breathing behind the mark */
        .splash-logo-wrap { position:relative; display:flex; align-items:center; justify-content:center; margin-bottom:32px; }
        .splash-glow { position:absolute; left:50%; top:50%; width:260px; height:260px; margin:-130px 0 0 -130px; border-radius:50%; background:radial-gradient(circle, rgba(196,113,237,0.28), rgba(79,172,254,0.14) 45%, transparent 72%); filter:blur(22px); opacity:0; animation:splashGlowIn 1.1s ease-out 0.05s forwards, splashGlowPulse 3s ease-in-out 1.3s infinite; pointer-events:none; }
        @keyframes splashGlowIn { to { opacity:1; } }
        @keyframes splashGlowPulse { 0%,100% { transform:scale(1); opacity:0.85; } 50% { transform:scale(1.15); opacity:1; } }

        /* One-shot shockwave ring that fires the instant the mark locks together */
        .splash-shock { position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.55); opacity:0; animation:splashShock 0.65s cubic-bezier(0.2,0.8,0.2,1) 0.52s forwards; pointer-events:none; }
        @keyframes splashShock { 0% { transform:scale(0.35); opacity:0.85; } 100% { transform:scale(3); opacity:0; } }

        /* Logo: pops in with a springy overshoot, then assembles from its three parts, then breathes gently */
        .splash-logo-container { position:relative; z-index:1; width:96px; height:96px; opacity:0; transform:scale(0.5) rotate(-8deg); animation:splashLogoIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.03s forwards, splashLogoBreathe 2.8s ease-in-out 1.3s infinite; }
        .splash-logo { width:100%; height:100%; display:block; }
        @keyframes splashLogoIn { to { opacity:1; transform:scale(1) rotate(0deg); } }
        @keyframes splashLogoBreathe { 0%,100% { transform:scale(1); filter:drop-shadow(0 0 0 rgba(196,113,237,0)); } 50% { transform:scale(1.05); filter:drop-shadow(0 0 16px rgba(196,113,237,0.4)); } }

        .logo-part { opacity:0; transform-box:fill-box; transform-origin:center; }
        .logo-leg-right { transform:translate(34px,-44px) rotate(-30deg) scale(0.6); animation:splashLegIn 0.55s cubic-bezier(0.34,1.56,0.64,1) 0.14s forwards; }
        .logo-leg-left { transform:translate(-34px,-44px) rotate(30deg) scale(0.6); animation:splashLegIn 0.55s cubic-bezier(0.34,1.56,0.64,1) 0.22s forwards; }
        .logo-bar { transform:scaleX(0) scaleY(0.3); animation:splashBarIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards; }
        @keyframes splashLegIn { to { opacity:1; transform:translate(0,0) rotate(0deg) scale(1); } }
        @keyframes splashBarIn { to { opacity:1; transform:scaleX(1) scaleY(1); } }

        /* Wordmark: letters pop in tinted with the logo's own palette, settle to neutral, then a light sweep loops across */
        .splash-text { position:relative; display:inline-flex; overflow:hidden; padding:0 2px; font-size:16px; font-weight:500; letter-spacing:4px; text-transform:uppercase; }
        .splash-text span { display:inline-block; opacity:0; filter:blur(5px); transform:translateY(12px) scale(0.85); color:var(--c); animation:splashLetterIn 0.5s cubic-bezier(0.2,0.8,0.2,1) forwards; animation-delay:calc(0.62s + var(--i) * 0.045s); }
        @keyframes splashLetterIn { 0% { opacity:0; filter:blur(5px); transform:translateY(12px) scale(0.85); } 55% { opacity:1; filter:blur(0); transform:translateY(0) scale(1.08); } 100% { opacity:0.9; filter:blur(0); transform:translateY(0) scale(1); color:var(--text-secondary); } }
        .splash-text::after { content:''; position:absolute; top:0; left:-160%; width:60%; height:100%; background:linear-gradient(100deg, transparent, rgba(255,255,255,0.5), transparent); animation:splashShimmer 2.4s ease-in-out 1.6s infinite; }
        @keyframes splashShimmer { 0% { left:-160%; } 55%,100% { left:160%; } }

        /* ============== SIDEBAR ============== */
        .sidebar { width:260px; background-color:var(--bg-sidebar); display:flex; flex-direction:column; padding:10px; border-right:1px solid var(--border-color); transition:width 0.3s var(--transition-bezier), padding 0.3s var(--transition-bezier), opacity 0.3s var(--transition-bezier); overflow-x:hidden; white-space:nowrap; flex-shrink:0; }
        .sidebar.collapsed { width:0; padding-left:0; padding-right:0; border-right:none; opacity:0; }
        .sidebar-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:10px; }
        .icon-btn { background:transparent; border:none; color:var(--text-secondary); cursor:pointer; padding:8px; border-radius:6px; display:flex; align-items:center; justify-content:center; transition:background 0.2s ease, color 0.2s ease, transform 0.15s ease; }
        .icon-btn:hover { background-color:var(--bg-hover); color:var(--text-primary); }
        .icon-btn:active { transform:scale(0.92); }
        .new-chat-btn { flex:1; display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background-color:transparent; color:var(--text-primary); border:1px solid var(--border-color); border-radius:8px; cursor:pointer; font-size:14px; font-weight:500; transition:background 0.2s ease, transform 0.15s ease; }
        .new-chat-btn:hover { background-color:var(--bg-hover); }
        .new-chat-btn:active { transform:scale(0.98); }
        .history-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:5px; }
        .history-item { padding:12px; border-radius:8px; cursor:pointer; font-size:14px; overflow:hidden; text-overflow:ellipsis; color:var(--text-secondary); transition:background 0.2s, color 0.2s; }
        .history-item:hover { background-color:var(--bg-hover); color:var(--text-primary); }
        .sidebar-settings { margin-top:auto; padding-top:16px; border-top:1px solid var(--border-color); display:flex; flex-direction:column; gap:12px; }
        .settings-panel { display:flex; flex-direction:column; gap:12px; animation:fadeInSettings 0.25s ease; }
        @keyframes fadeInSettings { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
        .settings-panel[hidden] { display:none; }
        .sidebar-setting-item { display:flex; justify-content:space-between; align-items:center; color:var(--text-secondary); font-size:13px; gap:10px; }
        .sidebar-setting-item input[type="number"] { width:50px; background-color:var(--bg-main); color:var(--text-primary); border:1px solid transparent; padding:4px 8px; border-radius:6px; outline:none; transition:background 0.2s, border-color 0.2s; }
        .sidebar-setting-item input[type="number"]:hover, .sidebar-setting-item input[type="number"]:focus { background-color:var(--bg-hover); border-color:rgba(255,255,255,0.2); }
        .sidebar-setting-item input[type="checkbox"] { width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }
        .sidebar-setting-item select { background-color:var(--bg-main); color:var(--text-primary); border:1px solid transparent; padding:4px 8px; border-radius:6px; outline:none; font-size:13px; cursor:pointer; transition:background 0.2s, border-color 0.2s; max-width:150px; }
        .sidebar-setting-item select:hover, .sidebar-setting-item select:focus { background-color:var(--bg-hover); border-color:rgba(255,255,255,0.2); }

        /* ============== HEADER + MODE TOGGLE ============== */
        .main-content { flex:1; display:flex; flex-direction:column; position:relative; min-width:0; }
        .header { height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; z-index:10; }
        .header-left { display:flex; align-items:center; gap:12px; }
        .sidebar-toggle-main { display:none; opacity:0; transform:scale(0.8); transition:opacity 0.3s var(--transition-bezier), transform 0.3s var(--transition-bezier); }
        .sidebar.collapsed ~ .main-content .sidebar-toggle-main { display:flex; opacity:1; transform:scale(1); }

        .mode-toggle { display:flex; align-items:center; background-color:var(--bg-input); border-radius:999px; padding:3px; position:relative; }
        .mode-toggle button { position:relative; z-index:1; border:none; background:transparent; color:var(--text-secondary); font-size:13px; font-weight:500; padding:7px 16px; border-radius:999px; cursor:pointer; transition:color 0.25s ease; display:flex; align-items:center; gap:6px; }
        .mode-toggle button svg { width:14px; height:14px; }
        .mode-toggle button.active { color:var(--bg-main); }
        .mode-toggle-pill { position:absolute; top:3px; left:3px; height:calc(100% - 6px); width:calc(50% - 3px); background-color:var(--text-primary); border-radius:999px; transition:transform 0.3s var(--transition-bezier); z-index:0; }
        .mode-toggle.code-active .mode-toggle-pill { transform:translateX(100%); }

        /* ============== CHAT AREA (simplified) ============== */
        .chat-container { flex:1; overflow-y:auto; display:flex; flex-direction:column; align-items:center; scroll-behavior:smooth; }
        .chat-content { width:100%; max-width:760px; padding:20px; display:flex; flex-direction:column; gap:26px; padding-bottom:150px; }
        .opening-scene { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; width:100%; text-align:center; padding:0 20px; }
        .mono-logo-container { margin-bottom:20px; opacity:0; transform:scale(0.85) translateY(15px); animation:popFadeIn 0.6s var(--transition-bezier) forwards; }
        .mono-logo { width:56px; height:56px; color:var(--text-primary); }
        .swirl-spin { animation:spin 3s linear infinite; }
        .opening-title { font-size:24px; font-weight:600; margin-bottom:10px; opacity:0; transform:translateY(12px); animation:slideFadeIn 0.6s var(--transition-bezier) 0.1s forwards; transition:opacity 0.2s ease; }
        .opening-subtitle { color:var(--text-secondary); font-size:14px; opacity:0; transform:translateY(12px); animation:slideFadeIn 0.6s var(--transition-bezier) 0.2s forwards; transition:opacity 0.2s ease; }
        @keyframes popFadeIn { to { opacity:1; transform:scale(1) translateY(0); } }
        @keyframes slideFadeIn { to { opacity:1; transform:translateY(0); } }

        .message-row { display:flex; width:100%; opacity:0; transform:translateY(10px); animation:slideFadeIn 0.4s var(--transition-bezier) forwards; }
        .message-row.user { justify-content:flex-end; }
        .message-row.assistant { justify-content:flex-start; }
        .message-bubble { max-width:88%; padding:14px 18px; font-size:15px; line-height:1.6; }
        .user .message-bubble { background-color:var(--bg-input); border-radius:20px 20px 6px 20px; white-space:pre-wrap; }

        /* Simplified assistant message: no repeated title per bubble, just a small quiet avatar */
        .assistant .message-bubble { background-color:transparent; border-radius:8px; color:var(--text-primary); display:flex; gap:12px; padding-left:0; align-items:flex-start; }
        .assistant-avatar { flex-shrink:0; width:26px; height:26px; padding:5px; border-radius:50%; border:1px solid var(--border-color); color:var(--text-secondary); margin-top:2px; position:relative; overflow:hidden; }
        /* Nexus-spark logo scaled down to sit inside the round avatar slot — same
           technique as .thinking-indicator below: the 280x280 logo is kept at its
           original authored size and shrunk with a CSS transform so nothing about
           it (blur radii, stroke widths, colors) needed to be re-tuned. Positioned
           absolutely (not flex-centered) because a flex parent shrinks a fixed-width
           flex child to fit BEFORE the scale transform applies, compounding the two
           shrinks and leaving only the core dot visible — absolute positioning keeps
           the 280px box at its true authored size so the transform is the only thing
           scaling it. */
        .assistant-avatar .logo-container { position:absolute; top:50%; left:50%; width:280px; height:280px; display:flex; justify-content:center; align-items:center; transform:translate(-50%,-50%) scale(0.093); transform-origin:center; }
        .assistant-avatar .ai-svg { width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 30px rgba(139,92,246,0.2)); transition:filter 0.5s ease; }
        .assistant-avatar .spark-group { transform-origin:50px 50px; transition:all 0.5s cubic-bezier(0.4,0,0.2,1); }
        .assistant-avatar .core-dot { transform-origin:50px 50px; transition:all 0.5s cubic-bezier(0.4,0,0.2,1); }
        .assistant-avatar .state-thinking .ai-svg { filter:drop-shadow(0 0 50px rgba(236,72,153,0.4)); }
        .assistant-avatar .state-thinking .spark-primary { animation:think-spin-primary 3s cubic-bezier(0.68,-0.55,0.265,1.55) infinite; }
        .assistant-avatar .state-thinking .spark-secondary { animation:think-spin-secondary 4s cubic-bezier(0.68,-0.55,0.265,1.55) infinite; }
        .assistant-avatar .state-thinking .core-dot { animation:think-core 1.5s ease-in-out infinite; fill:#ec4899; }
        .assistant-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:10px; }

        .message-text { word-break:break-word; }
        .message-text p { margin-bottom:12px; }
        .message-text p:last-child { margin-bottom:0; }
        .message-text h1, .message-text h2, .message-text h3, .message-text h4 { margin:18px 0 8px 0; font-weight:600; color:#fff; }
        .message-text h1 { font-size:1.4em; }
        .message-text h2 { font-size:1.25em; }
        .message-text h3 { font-size:1.1em; }
        .message-text ul, .message-text ol { margin:10px 0; padding-left:22px; }
        .message-text li { margin-bottom:6px; }
        .message-text table { width:100%; border-collapse:collapse; margin:14px 0; background-color:rgba(0,0,0,0.15); border-radius:8px; overflow:hidden; display:block; overflow-x:auto; }
        .message-text th, .message-text td { border:1px solid var(--border-color); padding:9px 13px; text-align:left; }
        .message-text th { background-color:rgba(255,255,255,0.05); font-weight:600; }

        /* Links inside an assistant answer — plain browser blue/underline would clash
           with the dark theme, so style them to match the accent color instead. Applies
           to every link in a message, including the "Sources" list appended below when
           Chat Mode's web search runs for a turn (see build_web_sources_markdown in
           app.py) — no separate class needed since regular Markdown links use the same
           look. */
        .message-text a { color:var(--accent); text-decoration:none; border-bottom:1px solid transparent; transition:border-color 0.15s ease; word-break:break-word; }
        .message-text a:hover { border-bottom-color:var(--accent); }

        /* The "---" divider + "Sources"/"Images" heading that Chat Mode appends after a
           turn that used web search. Just a lighter horizontal rule and slightly muted
           section labels — the links/list themselves reuse the existing ol/li styles above. */
        .message-text hr { border:none; border-top:1px solid var(--border-color); margin:18px 0 14px 0; }

        /* Image thumbnails from Chat Mode's web image search render as plain <img> tags
           inside a paragraph (via Markdown ![]()) — without sizing, a raw search-result
           image could be arbitrarily large and blow out the whole chat bubble. Capped to
           a small, consistent thumbnail, laid out in a wrapping row, each one clickable
           through to its source (the surrounding <a>, already produced by
           build_web_sources_markdown). */
        .message-text p:has(> a > img), .message-text p:has(> img) { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
        .message-text img { max-width:150px; max-height:110px; width:auto; height:auto; object-fit:cover; border-radius:10px; border:1px solid var(--border-color); background-color:var(--bg-input); display:block; transition:opacity 0.15s ease, border-color 0.15s ease; }
        .message-text a:has(> img) { border-bottom:none; line-height:0; }
        .message-text a:has(> img):hover img { opacity:0.85; border-color:rgba(255,255,255,0.3); }

        .message-text .code-card { margin:14px 0; border-radius:10px; overflow:hidden; border:1px solid var(--border-color); }
        .message-text .code-card-header { display:flex; justify-content:space-between; align-items:center; background-color:#2a2a2a; padding:8px 16px; font-size:12px; color:var(--text-secondary); border-bottom:1px solid var(--border-color); }
        .message-text .code-card-lang { font-family:'Courier New', Courier, monospace; text-transform:lowercase; }
        .message-text .artifact-tabs { display:flex; gap:2px; }
        .message-text .artifact-tab { background:transparent; border:none; color:var(--text-secondary); font-size:12px; padding:4px 10px; border-radius:6px; cursor:pointer; transition:background 0.2s, color 0.2s; }
        .message-text .artifact-tab:hover { color:var(--text-primary); }
        .message-text .artifact-tab.active { background-color:var(--bg-input); color:var(--text-primary); }
        .message-text .artifact-preview { background-color:#ffffff; padding:24px; display:flex; align-items:center; justify-content:center; overflow:auto; }
        .message-text .artifact-preview svg { max-width:100%; height:auto; }
        .message-text .artifact-preview.code-preview-frame { padding:0; display:block; }
        .message-text .code-preview-frame iframe { width:100%; min-height:360px; border:none; display:block; background:#fff; }
        .message-text .code-card [hidden] { display:none !important; }
        .message-text .artifact-chip { display:block; margin:14px 0; padding:10px; border:1px solid var(--border-color); border-radius:12px; background-color:#262626; cursor:pointer; transition:background 0.2s ease, border-color 0.2s ease; max-width:440px; }
        .message-text .artifact-chip:hover { background-color:#2d2d2d; border-color:rgba(255,255,255,0.18); }
        .message-text .artifact-chip-header { display:flex; align-items:center; gap:10px; padding:2px 3px 9px; }
        .message-text .artifact-chip-icon { flex-shrink:0; width:30px; height:30px; border-radius:8px; background-color:rgba(16,163,127,0.15); color:var(--accent); display:flex; align-items:center; justify-content:center; }
        .message-text .artifact-chip-icon svg { width:17px; height:17px; }
        .message-text .artifact-chip-info { flex:1; min-width:0; }
        .message-text .artifact-chip-title { font-size:13.5px; font-weight:500; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .message-text .artifact-chip-meta { font-size:12px; color:var(--text-secondary); margin-top:2px; }
        .message-text .artifact-chip-btn { flex-shrink:0; background-color:var(--text-primary); color:var(--bg-main); border:none; border-radius:999px; font-size:12.5px; font-weight:600; padding:6px 14px; cursor:pointer; }
        .message-text .artifact-file-list { display:flex; flex-direction:column; gap:4px; border-top:1px solid var(--border-color); padding-top:7px; }
        .message-text .artifact-file-row { display:flex; align-items:center; gap:9px; width:100%; border:0; border-radius:8px; background:transparent; color:var(--text-primary); padding:8px 7px; text-align:left; cursor:pointer; }
        .message-text .artifact-file-row:hover { background:rgba(255,255,255,0.07); }
        .message-text .artifact-file-icon { width:18px; height:18px; color:var(--text-secondary); flex-shrink:0; }
        .message-text .artifact-file-name { flex:1; min-width:0; font-family:'Courier New', Courier, monospace; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .message-text .artifact-file-language { color:var(--text-secondary); font-size:11.5px; }
        /* Small status-only chip shown INSIDE the chat message while a file is being
           generated — names the file and shows a pulsing "writing" dot, but never renders
           the code itself in the chat; the live code only ever appears in the canvas panel.
           Replaced by .artifact-chip once the file (or the whole multi-file build) is
           complete (see the code_result handler). */
        .message-text .inline-code-status { display:flex; align-items:center; gap:8px; margin:14px 0; padding:8px 12px; border:1px solid var(--border-color); border-radius:10px; background-color:#1c1c1c; max-width:320px; }
        .message-text .inline-code-status svg { width:14px; height:14px; color:var(--accent); flex-shrink:0; }
        .message-text .inline-code-status-filename { font-size:12.5px; font-weight:500; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .message-text .inline-code-status-dot { width:6px; height:6px; border-radius:50%; background-color:var(--accent); margin-left:auto; flex-shrink:0; animation:inlineStreamPulse 1s ease-in-out infinite; }
        @keyframes inlineStreamPulse { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
        .message-text .copy-btn { display:flex; align-items:center; gap:6px; background:transparent; border:none; color:var(--text-secondary); font-size:12px; cursor:pointer; padding:4px 8px; border-radius:6px; transition:background 0.2s, color 0.2s; }
        .message-text .copy-btn:hover { background-color:var(--bg-hover); color:var(--text-primary); }
        .message-text .copy-btn svg { width:14px; height:14px; }
        .message-text pre { background-color:#111; padding:16px; overflow-x:auto; margin:0; border:none; border-radius:0; }
        .message-text code { font-family:'Courier New', Courier, monospace; background-color:rgba(255,255,255,0.1); padding:2px 6px; border-radius:4px; font-size:0.9em; }
        .message-text pre code { background-color:transparent; padding:0; font-size:0.9em; border:none; }
        .message-text blockquote { border-left:4px solid var(--accent); padding-left:12px; color:var(--text-secondary); margin:12px 0; }

        .thinking-block { margin-top:2px; }
        .thinking-toggle { background:none; border:none; padding:0; font-size:13px; font-family:inherit; color:var(--text-secondary); cursor:pointer; }
        .thinking-toggle:hover { color:var(--text-primary); text-decoration:underline; }
        .thinking-toggle.shimmer {
            background-image: linear-gradient(
                90deg,
                var(--text-secondary) 0%,
                var(--text-secondary) 35%,
                var(--text-primary) 50%,
                var(--text-secondary) 65%,
                var(--text-secondary) 100%
            );
            background-size: 200% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: thinkingShimmer 1.6s linear infinite;
        }
        @keyframes thinkingShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .thinking-content { display:none; margin:10px 0 10px 12px; padding-left:22px; border-left:1px solid var(--border-color); font-size:14px; line-height:1.6; color:var(--text-secondary); }
        .thinking-content.expanded { display:block; }
        .thought-item { position: relative; margin-bottom: 14px; }
        .thought-item:last-child { margin-bottom: 0; }
        .thought-bullet { position: absolute; left: -26.5px; top: 8px; width: 8px; height: 8px; background-color: #555; border-radius: 50%; z-index: 1; }
        .thought-icon-wrapper { position: absolute; left: -34px; top: 0px; width: 24px; height: 24px; background-color: var(--bg-main); display: flex; align-items: center; justify-content: center; z-index: 2; }
        .thought-icon-wrapper svg { width: 20px; height: 20px; color: var(--text-secondary); }
        .thought-node { display:block; margin-bottom:3px; color:var(--text-primary); font-family:'Courier New', Courier, monospace; font-size:11px; letter-spacing:0.02em; opacity:0.78; }
        .thought-content { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
        .thought-content.expanded { -webkit-line-clamp: unset; }
        .show-more-btn { background: none; border: none; color: var(--text-primary); cursor: pointer; font-size: 12px; padding: 4px 0; margin-top: 2px; display: none; opacity: 0.7; }
        .show-more-btn:hover { opacity: 1; text-decoration: underline; }
        .spinner { width:14px; height:14px; border:2px solid var(--text-secondary); border-top:2px solid transparent; border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

        /* ============== CODE MODE: Claude-Code-style activity trace ==============
           "Edited 2 files, ran 2 commands, read a file · 1 note" summary bar with an
           expandable list of what actually happened this turn — each file edit shown
           as its own row with a filename badge and real +added/-removed line counts. */
        .activity-block { margin-top:2px; margin-bottom:4px; }
        .activity-toggle { display:flex; align-items:center; gap:6px; background:none; border:none; padding:4px 0; font-size:13px; font-family:inherit; color:var(--text-secondary); cursor:pointer; text-align:left; }
        .activity-toggle:hover { color:var(--text-primary); }
        .activity-toggle .activity-chevron { width:12px; height:12px; flex-shrink:0; transition:transform 0.15s ease; color:var(--text-secondary); }
        .activity-content.expanded .activity-chevron { transform:rotate(90deg); }
        .activity-toggle.shimmer {
            background-image: linear-gradient(90deg, var(--text-secondary) 0%, var(--text-secondary) 35%, var(--text-primary) 50%, var(--text-secondary) 65%, var(--text-secondary) 100%);
            background-size: 200% 100%; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: thinkingShimmer 1.6s linear infinite;
        }
        .activity-content { display:none; margin:6px 0 10px 4px; padding-left:20px; border-left:1px solid var(--border-color); }
        .activity-content.expanded { display:block; }
        .activity-row { display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13px; color:var(--text-secondary); line-height:1.4; }
        .activity-row-icon { width:15px; height:15px; flex-shrink:0; color:var(--text-secondary); display:flex; align-items:center; justify-content:center; }
        .activity-row-icon svg { width:100%; height:100%; }
        .activity-row-icon .thought-bullet { width:6px; height:6px; border-radius:50%; background-color:#555; }
        .activity-row-label { flex-shrink:0; }
        .activity-row-edit .activity-row-label { color:var(--text-primary); flex:1 1 auto; min-width:0; white-space:normal; }
        .activity-row-narration { font-style:italic; opacity:0.85; }
        .activity-file-badge { font-family:'Courier New', Courier, monospace; font-size:12px; background:rgba(255,255,255,0.08); color:var(--text-primary); padding:1px 7px; border-radius:5px; flex-shrink:0; }
        .activity-diff-stat { font-size:12px; font-family:'Courier New', Courier, monospace; white-space:nowrap; margin-left:auto; flex-shrink:0; }
        .activity-diff-add { color:#3fb950; }
        .activity-diff-del { color:#f85149; margin-left:4px; }
        .activity-row-status { font-style:italic; opacity:0.85; }

        /* ============== INPUT ============== */
        .input-container { position:absolute; bottom:0; left:0; width:100%; padding:22px; background:linear-gradient(180deg, rgba(33,33,33,0) 0%, var(--bg-main) 40%); display:flex; justify-content:center; }
        .input-box { width:100%; max-width:760px; background-color:var(--bg-input); border-radius:22px; border:1px solid var(--border-color); display:flex; flex-direction:column; align-items:stretch; padding:11px 15px; box-shadow:0 4px 20px rgba(0,0,0,0.15); transition:border-color 0.25s ease, box-shadow 0.25s ease; }
        .input-box:focus-within { border-color:rgba(255,255,255,0.3); box-shadow:0 4px 24px rgba(0,0,0,0.22); }
        .input-box textarea { flex:1; background:transparent; border:none; color:var(--text-primary); font-size:15.5px; resize:none; outline:none; max-height:200px; padding:8px 4px; line-height:1.5; }
        .input-box textarea::placeholder { color:var(--text-secondary); }
        .send-btn { background:var(--text-primary); color:var(--bg-main); border:none; border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:opacity 0.2s, transform 0.2s var(--transition-bezier); flex-shrink:0; }
        .send-btn:hover:not(:disabled) { transform:scale(1.06); }
        .send-btn:active:not(:disabled) { transform:scale(0.94); }
        .send-btn:disabled { opacity:0.3; cursor:not-allowed; }
        .send-btn svg { width:17px; height:17px; }

        /* ============== MODEL / EFFORT PICKER (input-attached, ChatGPT/Claude-style) ============== */
        .composer-toolbar { display:flex; align-items:center; justify-content:space-between; margin-top:6px; padding-top:2px; }
        .model-picker { position:relative; }
        .model-picker-btn { display:flex; align-items:center; gap:6px; background:transparent; border:1px solid var(--border-color); color:var(--text-primary); font-size:13px; font-weight:500; padding:6px 10px 6px 12px; border-radius:999px; cursor:pointer; transition:background 0.2s ease, border-color 0.2s ease; }
        .model-picker-btn:hover { background-color:var(--bg-hover); border-color:rgba(255,255,255,0.2); }
        .model-picker-btn svg { color:var(--text-secondary); flex-shrink:0; }
        .model-picker-sep { color:var(--text-secondary); }
        #modelPickerLevel { color:var(--text-secondary); }
        .model-picker-panel { position:absolute; left:0; bottom:calc(100% + 10px); width:280px; background-color:#262626; border:1px solid var(--border-color); border-radius:14px; box-shadow:0 10px 38px rgba(0,0,0,0.45); padding:6px; z-index:30; animation:pickerPopIn 0.16s var(--transition-bezier); }
        @keyframes pickerPopIn { from { opacity:0; transform:translateY(6px) scale(0.98); } to { opacity:1; transform:translateY(0) scale(1); } }
        .model-picker-panel[hidden] { display:none; }
        .picker-screen[hidden] { display:none; }
        .picker-row { display:flex; align-items:center; justify-content:space-between; width:100%; background:transparent; border:none; text-align:left; padding:9px 10px; border-radius:9px; cursor:pointer; color:var(--text-primary); transition:background 0.15s ease; }
        .picker-row:hover { background-color:var(--bg-hover); }
        .picker-row-nav { font-size:13.5px; }
        .picker-row-right { display:flex; align-items:center; gap:6px; color:var(--text-secondary); font-size:13px; }
        .picker-divider { height:1px; background-color:var(--border-color); margin:6px 6px; }
        .picker-model-row .picker-row-text { display:flex; flex-direction:column; gap:2px; }
        .picker-model-row .picker-row-name { font-size:14px; font-weight:500; color:var(--text-primary); }
        .picker-model-row .picker-row-desc { font-size:12px; color:var(--text-secondary); }
        .picker-check { color:var(--accent); flex-shrink:0; margin-left:8px; }
        .picker-back { display:flex; align-items:center; gap:6px; background:transparent; border:none; color:var(--text-secondary); font-size:12.5px; font-weight:500; padding:6px 8px 10px; cursor:pointer; }
        .picker-back:hover { color:var(--text-primary); }
        .picker-level-desc { font-size:12px; color:var(--text-secondary); line-height:1.5; padding:0 8px 8px; }
        .picker-level-row { font-size:14px; }
        .picker-badge { font-size:10px; color:var(--text-secondary); background-color:rgba(255,255,255,0.08); padding:2px 6px; border-radius:5px; margin-left:8px; }

        /* Floating "jump to latest" button — only shown once the user has scrolled
           up away from the bottom during a response, exactly like ChatGPT. Clicking
           it (or scrolling back down manually) re-engages auto-scroll. */
        .scroll-to-bottom-btn { position:absolute; left:50%; bottom:130px; transform:translateX(-50%) translateY(10px); width:36px; height:36px; border-radius:50%; background-color:var(--bg-input); border:1px solid var(--border-color); color:var(--text-primary); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,0.25); opacity:0; pointer-events:none; transition:opacity 0.2s ease, transform 0.2s var(--transition-bezier); z-index:5; }
        .scroll-to-bottom-btn.visible { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
        .scroll-to-bottom-btn svg { width:16px; height:16px; }

        /* Nexus-spark indicator. Container is a fixed 30px inline slot; the inner
           .logo-container is kept at its original authored 280x280 box and scaled
           down with a CSS transform, so every value below (blur radii, stroke
           widths, keyframe %, easing curves, colors) is byte-for-byte what was
           provided — nothing was hand-tuned for the smaller size, only shrunk. */
        .thinking-indicator { display:inline-flex; width:30px; height:30px; vertical-align:middle; margin-left:4px; overflow:hidden; }
        .thinking-indicator .logo-container { position:relative; width:280px; height:280px; display:flex; justify-content:center; align-items:center; transform:scale(0.107); transform-origin:center; }
        .thinking-indicator .ai-svg { width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 30px rgba(139,92,246,0.2)); transition:filter 0.5s ease; }
        .thinking-indicator .spark-group { transform-origin:50px 50px; transition:all 0.5s cubic-bezier(0.4,0,0.2,1); }
        .thinking-indicator .core-dot { transform-origin:50px 50px; transition:all 0.5s cubic-bezier(0.4,0,0.2,1); }
        @keyframes think-spin-primary { 0% { transform:rotate(0deg) scale(0.8); } 50% { transform:rotate(180deg) scale(1.1); } 100% { transform:rotate(360deg) scale(0.8); } }
        @keyframes think-spin-secondary { 0% { transform:rotate(45deg) scale(1.1); } 50% { transform:rotate(-135deg) scale(0.8); } 100% { transform:rotate(-315deg) scale(1.1); } }
        @keyframes think-core { 0%, 100% { transform:scale(0.5); opacity:0.5; } 50% { transform:scale(1.5); opacity:1; } }
        @keyframes listen-pulse-primary { 0%, 100% { transform:rotate(45deg) scale(0.95); } 50% { transform:rotate(45deg) scale(1.15); } }
        @keyframes listen-pulse-secondary { 0%, 100% { transform:rotate(0deg) scale(0.85); } 50% { transform:rotate(0deg) scale(1.05); } }
        @keyframes listen-core { 0%, 100% { transform:scale(1); opacity:0.9; } 25% { transform:scale(1.4); opacity:1; } 50% { transform:scale(1.2); opacity:0.9; } 75% { transform:scale(1.4); opacity:1; } }
        .thinking-indicator .state-thinking .ai-svg { filter:drop-shadow(0 0 50px rgba(236,72,153,0.4)); }
        .thinking-indicator .state-thinking .spark-primary { animation:think-spin-primary 3s cubic-bezier(0.68,-0.55,0.265,1.55) infinite; }
        .thinking-indicator .state-thinking .spark-secondary { animation:think-spin-secondary 4s cubic-bezier(0.68,-0.55,0.265,1.55) infinite; }
        .thinking-indicator .state-thinking .core-dot { animation:think-core 1.5s ease-in-out infinite; fill:#ec4899; }
        .thinking-indicator .state-listening .ai-svg { filter:drop-shadow(0 0 40px rgba(56,189,248,0.4)); }
        .thinking-indicator .state-listening .spark-primary { animation:listen-pulse-primary 2s ease-in-out infinite; }
        .thinking-indicator .state-listening .spark-secondary { animation:listen-pulse-secondary 2s ease-in-out infinite 0.2s; }
        .thinking-indicator .state-listening .core-dot { animation:listen-core 2s ease-in-out infinite; fill:#38bdf8; }

        /* Smooth cross-fade when swapping between Chat / Code content */
        .mode-fade-out { animation:modeFadeOut 0.15s ease forwards; }
        .mode-fade-in { animation:modeFadeIn 0.25s ease forwards; }
        @keyframes modeFadeOut { to { opacity:0; transform:translateY(4px); } }
        @keyframes modeFadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

        /* ============== CODE CANVAS ==============
           A dedicated split-panel that appears next to the chat column, only
           ever used in Code mode. It is a plain flex sibling of .main-content,
           so it never touches Chat mode's markup, state, or event handlers. */
        .canvas-panel { flex:1 1 0; min-width:0; display:flex; flex-direction:column; background-color:#181818; border-left:1px solid var(--border-color); animation:canvasSlideIn 0.25s var(--transition-bezier); }
        .canvas-panel[hidden] { display:none; }
        @keyframes canvasSlideIn { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:translateX(0); } }
        .canvas-header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-bottom:1px solid var(--border-color); flex-shrink:0; }
        .canvas-header-left { display:flex; align-items:center; gap:8px; min-width:0; }
        .canvas-header-left svg { width:16px; height:16px; color:var(--text-secondary); flex-shrink:0; }
        .canvas-title { font-size:13px; font-weight:500; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .canvas-header-right { display:flex; align-items:center; gap:4px; flex-shrink:0; }
        .canvas-tabs { display:flex; align-items:center; background-color:var(--bg-input); border-radius:999px; padding:3px; margin-right:6px; }
        .canvas-tabs button { border:none; background:transparent; color:var(--text-secondary); font-size:12.5px; font-weight:500; padding:6px 14px; border-radius:999px; cursor:pointer; transition:background 0.2s ease, color 0.2s ease; }
        .canvas-tabs button.active { background-color:var(--text-primary); color:var(--bg-main); }
        .canvas-icon-btn { background:transparent; border:none; color:var(--text-secondary); cursor:pointer; padding:6px; border-radius:6px; display:flex; align-items:center; justify-content:center; transition:background 0.2s ease, color 0.2s ease; }
        .canvas-icon-btn:hover { background-color:var(--bg-hover); color:var(--text-primary); }
        .canvas-icon-btn svg { width:16px; height:16px; }
        /* File-switcher strip along the top of the canvas — only shown once a build has
           produced more than one file, so a single-file result looks exactly as before. */
        .canvas-file-tabs { display:flex; align-items:center; gap:2px; padding:6px 10px; border-bottom:1px solid var(--border-color); overflow-x:auto; flex-shrink:0; }
        .canvas-file-tabs[hidden] { display:none; }
        .canvas-file-tab { display:flex; align-items:center; gap:6px; border:none; background:transparent; color:var(--text-secondary); font-size:12.5px; font-family:'Courier New', Courier, monospace; padding:6px 10px; border-radius:8px; cursor:pointer; white-space:nowrap; flex-shrink:0; transition:background 0.2s ease, color 0.2s ease; }
        .canvas-file-tab:hover { background-color:var(--bg-hover); color:var(--text-primary); }
        .canvas-file-tab.active { background-color:var(--bg-input); color:var(--text-primary); }
        .canvas-file-tab .canvas-file-tab-dot { width:6px; height:6px; border-radius:50%; background-color:var(--accent); flex-shrink:0; animation:inlineStreamPulse 1s ease-in-out infinite; }
        .canvas-body { flex:1; min-height:0; position:relative; }
        .canvas-view { width:100%; height:100%; overflow:auto; }
        .canvas-view[hidden] { display:none; }
        .canvas-view iframe { width:100%; height:100%; border:none; display:block; background:#fff; }
        #canvasCodeView pre { margin:0; padding:20px; min-height:100%; background-color:#111; }
        #canvasCodeView code { font-size:13px; line-height:1.65; font-family:'Courier New', Courier, monospace; }
    </style>
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <div class="splash-logo-wrap">
            <div class="splash-glow"></div>
            <div class="splash-shock"></div>
            <div class="splash-logo-container">
                <svg class="splash-logo" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="grad-apex-left" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fa709a"/>
                            <stop offset="100%" stop-color="#fee140"/>
                        </linearGradient>
                        <linearGradient id="grad-apex-right" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#4facfe"/>
                            <stop offset="100%" stop-color="#00f2fe"/>
                        </linearGradient>
                        <linearGradient id="grad-apex-center" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#c471ed"/>
                            <stop offset="100%" stop-color="#f64f59"/>
                        </linearGradient>
                        <filter id="glow-4" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
                        </filter>
                    </defs>
                    <g filter="url(#glow-4)">
                        <!-- Right leg drops in from upper-right -->
                        <g class="logo-part logo-leg-right">
                            <rect x="105" y="30" width="32" height="170" rx="16" transform="rotate(-32, 120, 60)" fill="url(#grad-apex-right)"/>
                        </g>
                        <!-- Left leg drops in from upper-left -->
                        <g class="logo-part logo-leg-left">
                            <rect x="103" y="30" width="32" height="170" rx="16" transform="rotate(32, 120, 60)" fill="url(#grad-apex-left)"/>
                        </g>
                        <!-- Crossbar scales in last, locking the mark together -->
                        <g class="logo-part logo-bar">
                            <rect x="80" y="145" width="80" height="24" rx="12" fill="url(#grad-apex-center)"/>
                        </g>
                    </g>
                </svg>
            </div>
        </div>
        <div class="splash-text">
            <span style="--i:0;--c:#fa709a">M</span><span style="--i:1;--c:#fee140">A</span><span style="--i:2;--c:#4facfe">X</span><span style="--i:3;--c:#00f2fe">I</span><span style="--i:4;--c:#c471ed">M</span><span style="--i:5;--c:#f64f59">U</span><span style="--i:6;--c:#fa709a">S</span>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="icon-btn" onclick="toggleSidebar()" title="Close sidebar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                </svg>
            </button>
            <button class="new-chat-btn" onclick="startNewChat()">
                <span>New session</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"></path>
                </svg>
            </button>
        </div>
        <div class="history-list" id="historyList"></div>
        <div class="sidebar-settings">
            <!-- Chat mode settings — Model, Temperature and Effort moved to the
                 picker attached to the message composer (see input-container below). -->
            <div class="settings-panel" id="chatSettings">
                <div class="sidebar-setting-item">
                    <label title="Stream Response Tokens">Stream Response</label>
                    <input type="checkbox" id="streamSetting" checked>
                </div>
            </div>

            <!-- Code mode settings — Model and Effort moved to the composer picker too. -->
            <div class="settings-panel" id="codeSettings" hidden>
                <div class="sidebar-setting-item">
                    <label title="Stream Response Tokens">Stream Response</label>
                    <input type="checkbox" id="codeStreamSetting" checked>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div class="header-left">
                <button class="icon-btn sidebar-toggle-main" onclick="toggleSidebar()" title="Open sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="3" x2="9" y2="21"></line>
                    </svg>
                </button>
            </div>
            <div class="mode-toggle" id="modeToggle">
                <div class="mode-toggle-pill"></div>
                <button type="button" class="active" data-mode="chat" onclick="switchMode('chat')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    Chat
                </button>
                <button type="button" data-mode="code" onclick="switchMode('code')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                    Code
                </button>
            </div>
            <div style="width:36px"></div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="opening-scene" id="openingScene">
                <div class="mono-logo-container">
                    <svg class="mono-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 12 12 17 22 12"></polyline>
                        <polyline points="2 17 12 22 22 17"></polyline>
                    </svg>
                </div>
                <h1 class="opening-title" id="openingTitle">How can I help you achieve your goal?</h1>
                <p class="opening-subtitle" id="openingSubtitle">Execution destroys all excuses</p>
            </div>
            <div class="chat-content" id="chatContent" style="display: none;"></div>
        </div>

        <button type="button" class="scroll-to-bottom-btn" id="scrollToBottomBtn" onclick="jumpToBottom()" title="Scroll to latest">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
        </button>

        <div class="input-container">
            <div class="input-box">

    <!-- ================= CODE CANVAS =================
