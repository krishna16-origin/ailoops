                }

                body.appendChild(contentDiv);
                bubble.appendChild(avatar);
                bubble.appendChild(body);
            } else {
                bubble.innerText = text;
            }

            row.appendChild(bubble);
            chatContent.appendChild(row);
            scrollToBottom(true); // new message = always jump down and re-pin

            return role === 'assistant' ? bubble : null;
        }

        // distance (px) from the true bottom that still counts as "at the bottom" —
        // gives a little slack so a stray sub-pixel scroll doesn't unpin the view
        const SCROLL_BOTTOM_THRESHOLD = 80;

        // Auto-scroll during streaming, but ONLY while the user is already pinned
        // to the bottom. If they've scrolled up — e.g. to re-read something while
        // the thinking/answer keeps streaming in — this becomes a no-op instead of
        // yanking them back down, matching ChatGPT's behavior. Pass force=true for
        // moments that should always jump (sending a message, clicking the button).
        function scrollToBottom(force = false) {
            if (!force && !isPinnedToBottom) return;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            isPinnedToBottom = true;
            scrollToBottomBtn.classList.remove('visible');
        }

        // Wired to the floating jump button.
        function jumpToBottom() {
            scrollToBottom(true);
        }

        // Tracks whether the user has manually scrolled away from the bottom, and
        // shows/hides the floating jump button accordingly.
        chatContainer.addEventListener('scroll', () => {
            const distanceFromBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight;
            isPinnedToBottom = distanceFromBottom <= SCROLL_BOTTOM_THRESHOLD;
            scrollToBottomBtn.classList.toggle('visible', !isPinnedToBottom && modes[currentMode].hasMessages);
        });

        // Updates just the .message-prose child of a message-text container, creating it if
        // needed. Unlike assigning textContainer.innerHTML directly (the old approach), this
        // never touches other children — so an inline-code-stream card appended alongside the
        // prose survives every re-render of the streamed answer text.
        function setProse(container, html) {
            let prose = container.querySelector('.message-prose');
            if (!prose) {
                prose = document.createElement('div');
                prose.className = 'message-prose';
                container.insertBefore(prose, container.firstChild);
            }
            prose.innerHTML = DOMPurify.sanitize(html);
            return prose;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isWaitingForResponse) return;

            const mode = currentMode;
            appendMessage('user', text);
            userInput.value = '';
            autoResize(userInput);
            sendBtn.disabled = true;
            isWaitingForResponse = true;

            let apiUrl, payload, useStream;

            if (mode === 'chat') {
                const modelType = document.getElementById('modelType').value;
                const thinkingLevel = document.getElementById('tempSetting').value;
                useStream = document.getElementById('streamSetting').checked;
                apiUrl = `${API_BASE}/chat`;
                payload = {
                    message: text,
                    session_id: modes.chat.sessionId,
                    model_type: modelType,
                    stream: useStream,
                    temperature: 0.3,
                    thinking_level: thinkingLevel
                };
            } else {
                const codeModel = document.getElementById('codeModel').value;
                const reasoningLevel = document.getElementById('codeReasoningLevel').value;
                useStream = document.getElementById('codeStreamSetting').checked;
                apiUrl = `${API_BASE}/code-chat`;
                payload = {
                    message: text,
                    session_id: modes.code.sessionId,
                    model: codeModel,
                    reasoning_level: reasoningLevel,
                    stream: useStream
                    // No temperature — Code Mode intentionally omits it; backend applies its own default.
                };
            }

            const assistantBubble = appendMessage('assistant', '');
            const textContainer = assistantBubble.querySelector('.message-text');
            const thinkingBlock = assistantBubble.querySelector('.thinking-block');
            const thinkingToggle = thinkingBlock.querySelector('.thinking-toggle');
            const thinkingContent = thinkingBlock.querySelector('.thinking-content');
            const thinkingStartTime = Date.now();

            // Show "Thinking" the instant the request goes out — like Claude.ai — rather
            // than waiting for a real backend status event, which may never arrive for
            // quick replies that skip the planning loop entirely (e.g. "hi").
            thinkingBlock.style.display = 'block';
            thinkingToggle.textContent = 'Thinking';
            thinkingToggle.classList.add('shimmer');

            let thinkingDone = false;      // true once the model has moved on to answering
            let answerStarted = false;     // true once the first answer token has arrived
            let thinkingFinalized = false; // true once "Thought for Ns" has been set for good
            let lastThoughtStep = null;    // step name of the most recently rendered thought bubble
            let lastThoughtContentEl = null; // its .thought-content node, so a repeat 'thinking'
                                              // heartbeat can update it in place instead of piling
                                              // up duplicate "Still working on it..." bubbles
            let liveThoughtEl = null;      // the .thought-live-content node currently receiving the
                                            // model's own live <think> trace, token by token
            let currentStreamFileKey = null; // which file's canvas panel is currently receiving
                                              // live code_delta content (set by code_file_start,
                                              // cleared once its code_file_diff lands)

            // Icons mapping for different thought types
            const thoughtIcons = {
                'web': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>`,
                'search': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>`,
                'error': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`,
                'success': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
                'plan': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="M9 16l2 2 4-4"></path></svg>`,
                'default': `<div class="thought-bullet"></div>`
            };

            function getIconForLabel(label, detail) {
                const t = ((label || '') + ' ' + (detail || '')).toLowerCase();
                if (t.includes('plan')) return thoughtIcons['plan'];
                if (t.includes('search')) return thoughtIcons['search'];
                if (t.includes('fetch') || t.includes('web') || t.includes('url') || t.includes('http')) return thoughtIcons['web'];
                if (t.includes('fail') || t.includes('error') || t.includes('unable')) return thoughtIcons['error'];
                if (t.includes('finish') || t.includes('success') || t.includes('complete') || t.includes('done')) return thoughtIcons['success'];
                if (t.includes('writing') || t.includes('code')) return thoughtIcons['plan'];
                return thoughtIcons['default'];
            }

                                        // Real backend progress event for the direct response pass. Reveals the block
            // and keeps it expanded while it grows. Shared by both modes.

            function addThought(label, detail, step) {
                if (thinkingDone) return;
                thinkingBlock.style.display = 'block';
                thinkingToggle.textContent = label || 'Thinking';
                thinkingToggle.classList.add('shimmer');

                // A 'thinking' step is a spinner_tick heartbeat — the backend hasn't
                // finished anything new, it's just cycling the status word so the UI
                // doesn't look frozen while one node call runs long. If the previous
                // bubble was ALSO a heartbeat (no real step landed in between), update
                // that same bubble's text instead of appending another identical
                // "Still working on it..." line — this is exactly how Claude's own
                // status indicator behaves: one line updating in place, not a growing
                // stack of duplicates. A genuinely new step always gets its own bubble.
                if (step === 'thinking' && lastThoughtStep === 'thinking' && lastThoughtContentEl) {
                    lastThoughtContentEl.textContent = detail || label || '';
                    scrollToBottom();
                    return;
                }

                const item = document.createElement('div');
                item.className = 'thought-item';

                const icon = getIconForLabel(label, detail);
                if (icon.includes('svg')) {
                    item.innerHTML = `<div class="thought-icon-wrapper">${icon}</div>`;
                } else {
                    item.innerHTML = icon; // bullet
                }

                const node = document.createElement('span');
                node.className = 'thought-node';
                node.textContent = step || 'backend_node';
                item.appendChild(node);

                const content = document.createElement('div');
                content.className = 'thought-content';
                content.textContent = detail || label || '';
                item.appendChild(content);

                const showMore = document.createElement('button');
                showMore.className = 'show-more-btn';
                showMore.textContent = 'Show more';
                item.appendChild(showMore);

                thinkingContent.appendChild(item);

                setTimeout(() => {
                    if (content.scrollHeight > content.clientHeight) {
                        showMore.style.display = 'block';
                        showMore.onclick = () => {
                            const isExpanded = content.classList.toggle('expanded');
                            showMore.textContent = isExpanded ? 'Show less' : 'Show more';
                        };
                    }
                }, 0);

                lastThoughtStep = step || null;
                lastThoughtContentEl = content;

                scrollToBottom();
            }

            // Streams the model's OWN live reasoning — whatever real text it wrote
            // inside its <think> block on the backend — straight into the thinking
            // panel as it arrives, chunk by chunk. This is the actual chain of
            // thought, not a synthesized status line, so it reads exactly like
            // Claude.ai's extended-thinking pane: one continuous, auto-scrolling
            // block that keeps growing until the model moves on to its answer.
            function appendLiveThought(text) {
                if (thinkingDone || !text) return;
                thinkingBlock.style.display = 'block';
                thinkingContent.classList.add('expanded');
                thinkingToggle.textContent = 'Thinking';
                thinkingToggle.classList.add('shimmer');

                if (!liveThoughtEl) {
                    const item = document.createElement('div');
                    item.className = 'thought-item thought-live-item';
                    item.innerHTML = `<div class="thought-bullet"></div><span class="thought-node">reasoning</span>`;
                    const content = document.createElement('div');
                    content.className = 'thought-live-content';
                    const cursor = document.createElement('span');
                    cursor.className = 'thought-live-cursor';
                    content.appendChild(cursor);
                    item.appendChild(content);
                    thinkingContent.appendChild(item);
                    liveThoughtEl = content;
                    // A live reasoning stream isn't a repeating heartbeat bubble — keep it
                    // out of the addThought() "same step, update in place" bookkeeping so a
                    // structured status event right after it always gets its own new bubble.
                    lastThoughtStep = null;
                    lastThoughtContentEl = null;
                }

                const cursor = liveThoughtEl.querySelector('.thought-live-cursor');
                const textNode = document.createTextNode(text);
                if (cursor) liveThoughtEl.insertBefore(textNode, cursor);
                else liveThoughtEl.appendChild(textNode);
                liveThoughtEl.scrollTop = liveThoughtEl.scrollHeight;
                scrollToBottom();
            }

            // Called the moment the answer actually starts streaming. Switches the main
            // toggle from a shimmering "Thinking" to a shimmering "Answering" and
            // collapses the thought log, but doesn't settle the final label yet.
            function startAnswering() {
                if (thinkingDone) return;
                thinkingDone = true;
                thinkingToggle.textContent = 'Answering';
                thinkingToggle.classList.add('shimmer');
                thinkingContent.classList.remove('expanded');
                const cursor = liveThoughtEl ? liveThoughtEl.querySelector('.thought-live-cursor') : null;
                if (cursor) cursor.remove();
            }

            // Called once the response is fully done (stream ended, or non-streaming
            // reply received). Settles the main toggle into "Thought for Ns" and stops
            // the shimmer for good, Claude-style. Same behavior for both modes.
            function finishThinking() {
                if (thinkingFinalized) return;
                thinkingFinalized = true;
                thinkingDone = true;
                const seconds = Math.max(1, Math.round((Date.now() - thinkingStartTime) / 1000));
                thinkingToggle.textContent = `Thought for ${seconds}s`;
                thinkingToggle.classList.remove('shimmer');
                thinkingContent.classList.remove('expanded');
                const liveCursor = liveThoughtEl ? liveThoughtEl.querySelector('.thought-live-cursor') : null;
                if (liveCursor) liveCursor.remove();
                // Nothing to expand into if no detailed step events ever arrived —
                // drop the (now inert) toggle affordance rather than leave a button
                // that opens onto an empty panel.
                if (!thinkingContent.childElementCount) {
                    thinkingToggle.style.cursor = 'default';
                    thinkingToggle.style.pointerEvents = 'none';
                }
            }

            let assistantFullText = '';
            let codeResult = null; // { code, language, files, activities, activity_summary } — Code Mode only

            // Re-parsing the whole accumulated markdown and rewriting innerHTML on
            // EVERY streamed token (which fast models can emit dozens of times a
            // second) is what causes visible stutter/freeze on longer answers — the
            // render work grows with the text while the token rate stays high, so
            // rendering falls behind and the UI appears stuck. Coalescing all tokens
            // that arrive within one frame into a single render keeps the display
            // just as smooth (still up to 60 updates/sec) while cutting the actual
            // parse+DOM work by however many tokens land per frame. The stream loop
            // below always does one more full, unthrottled render right after it
            // ends, so no trailing token is ever lost to a skipped frame.
            let renderScheduled = false;
            function scheduleAnswerRender() {
                if (renderScheduled) return;
                renderScheduled = true;
                requestAnimationFrame(() => {
                    renderScheduled = false;
                    const liveText = (mode === 'code') ? stripCodeFence(assistantFullText) : assistantFullText;
                    setProse(textContainer, marked.parse(normalizeMathDelimiters(liveText)));
                    if (indicatorEl) textContainer.appendChild(indicatorEl);
                    scrollToBottom();
                });
            }
            const workflowEl = mode === 'code' ? assistantBubble.querySelector('.response-workflow') : null;
            const fileCardsEl = mode === 'code' ? assistantBubble.querySelector('.response-file-cards') : null;
            const canvasEl = mode === 'code' ? assistantBubble.querySelector('.response-canvas') : null;
            // Per-file canvas state for this one assistant turn: filename -> { language,
            // additions, deletions, diffLines, content, streaming }. Populated live as
            // code_file_start / code_file_diff events arrive, and reconciled against the
            // authoritative final result in finalizeCodeResult() either way (stream or not).
            const canvasFiles = new Map();
            let canvasActiveTab = null; // filename currently shown, or '__preview__'
            const workflowRowsByFile = new Map(); // filename -> <div class="response-workflow-row">, for live updates

            const WORKFLOW_ICONS = {
                edit: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5a1.6 1.6 0 0 1 2.3 2.3L5.5 13 2 14l1-3.5 8.5-8Z"/></svg>',
                view: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3 2 5.5 4.5 8M11.5 3 14 5.5 11.5 8M9.5 2.5l-3 8"/></svg>',
                note: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 1.5"/></svg>',
                // Forward-looking "here's what I'll do next" bullet — a plain dot,
                // deliberately lighter-weight than the note clock so accomplishment
                // (note) and next-step (plan) rows read differently at a glance.
                plan: '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="3"/></svg>',
                // Real server-side operation (currently: an actual diff computation),
                // shown the same way a terminal/tool-call row reads in Claude Code.
                command: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M4 6.5 6.5 8.5 4 10.5M8 10.5h3.5"/></svg>',
            };
            const FILE_ICON = {
                code: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3 2 5.5 4.5 8M11.5 3 14 5.5 11.5 8M9.5 2.5l-3 8"/></svg>',
                plain: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.5h5.5L13 5v9.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1Z"/><path d="M9.5 1.5V5H13"/></svg>',
            };
            const CODE_EXTENSIONS = new Set(['html', 'htm', 'css', 'js', 'jsx', 'ts', 'tsx', 'py', 'json', 'java', 'c', 'cpp', 'go', 'rb', 'php', 'swift', 'rs', 'sql', 'sh']);

            function escapeHtml(str) {
                return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }
            function inlineBackticks(str) {
                return escapeHtml(str).replace(/`([^`]+)`/g, '<code>$1</code>');
            }

            // Shared row builder — used both by the final, authoritative
            // renderWorkflow() rebuild below AND by the live
            // code_file_start/code_file_diff handlers further down, so a row
            // streamed in live looks pixel-identical to one built from the
            // final result and never has to be re-created, only updated.
            function createWorkflowRow(activity) {
                const row = document.createElement('div');
                row.className = `response-workflow-row ${activity.kind}`;
                const icon = document.createElement('span');
                icon.className = 'response-workflow-icon';
                icon.innerHTML = WORKFLOW_ICONS[activity.kind] || WORKFLOW_ICONS.note;
                row.appendChild(icon);
                const text = document.createElement('span');
                if (activity.kind === 'edit') {
                    setWorkflowEditRowText(text, activity);
                    // Clicking an edited-file row jumps to that file's tab in the
                    // diff/preview canvas below, the same way a file card does.
                    if (activity.filename !== undefined) {
                        row.style.cursor = 'pointer';
                        row.addEventListener('click', () => openCanvasTab(activity.filename));
                    }
                } else if (activity.kind === 'note') {
                    text.className = 'response-workflow-note-text';
                    text.innerHTML = inlineBackticks(activity.text || '');
                } else if (activity.kind === 'plan') {
                    // Forward-looking "next step" bullet — same inline-backtick
                    // handling as a note, just muted instead of bold.
                    text.className = 'response-workflow-plain';
                    text.innerHTML = inlineBackticks(activity.text || '');
                } else if (activity.kind === 'command') {
                    // A real server-side operation (e.g. "diff -u file.html") —
                    // shown verbatim, monospaced, like terminal output.
                    text.className = 'response-workflow-command-text';
                    text.textContent = activity.text || '';
                } else {
                    text.className = 'response-workflow-plain';
                    text.innerHTML = inlineBackticks(activity.text || '');
                }
                row.appendChild(text);
                return row;
            }

            function setWorkflowEditRowText(textEl, activity) {
                textEl.innerHTML = `Edited <span class="response-workflow-edit-file">${escapeHtml(activity.file || 'generated code')}</span>` +
                    (activity.additions ? `<span class="response-workflow-add">+${activity.additions}</span>` : '') +
                    (activity.deletions ? `<span class="response-workflow-del">-${activity.deletions}</span>` : '');
            }

            function renderWorkflow(activities, summary) {
                if (!workflowEl || !Array.isArray(activities) || !activities.length) return;
                workflowEl.hidden = false;
                const summaryEl = workflowEl.querySelector('.response-workflow-summary');
                const listEl = workflowEl.querySelector('.response-workflow-list');
                if (summary) {
                    const parts = [];
                    if (summary.commands) parts.push(`Ran ${summary.commands} command${summary.commands === 1 ? '' : 's'}`);
                    if (summary.files_edited) parts.push(`edited ${summary.files_edited} file${summary.files_edited === 1 ? '' : 's'}`);
                    if (summary.files_viewed) parts.push(`viewed ${summary.files_viewed} file${summary.files_viewed === 1 ? '' : 's'}`);
                    let line = parts.join(', ');
                    if (summary.notes) line += (line ? ' · ' : '') + `${summary.notes} note${summary.notes === 1 ? '' : 's'}`;
                    summaryEl.textContent = line;
                    summaryEl.style.display = line ? '' : 'none';
                } else {
                    summaryEl.style.display = 'none';
                }
                // This is the final, authoritative trace (from build_turn_activities()
                // server-side) — it always fully replaces whatever the live
                // code_file_start/code_file_diff handlers below already built, so any
                // ordering/naming quirk in the live preview self-corrects here.
                listEl.replaceChildren();
                workflowRowsByFile.clear();
                activities.forEach((activity) => {
                    const row = createWorkflowRow(activity);
                    if (activity.kind === 'edit' && activity.filename !== undefined) {
                        workflowRowsByFile.set(activity.filename, row);
                    }
                    listEl.appendChild(row);
                });
                scrollToBottom();
            }

            // ============== CODE MODE: live diff + preview canvas ==============
            // Wires up the .response-canvas markup: a row of per-file tabs (each
            // showing a live +added/-removed count as soon as that file's diff is
            // known) plus a Preview tab that renders the generated site in a
            // sandboxed iframe. Updated incrementally as code_file_start /
            // code_file_diff SSE events arrive, and reconciled once more from the
            // authoritative final result — so it works the same whether the file
            // came from a live stream or a plain (non-streaming) response.
            const PREVIEWABLE_EXT = new Set(['html', 'htm']);

            function fileExt(filename) {
                return (filename || '').split('.').pop().toLowerCase();
            }
            function isPreviewableFile(filename, language) {
                return PREVIEWABLE_EXT.has(fileExt(filename)) || (language || '').toLowerCase() === 'html';
            }
            function canvasFileLabel(filename) {
                return filename || 'generated code';
            }

            function upsertCanvasFile(filename, patch) {
                if (!canvasEl) return;
                const key = filename || '';
                const existing = canvasFiles.get(key) || { language: '', additions: 0, deletions: 0, diffLines: [], content: '', streaming: true };
                const merged = Object.assign(existing, patch);
                canvasFiles.set(key, merged);
                if (canvasActiveTab === null) canvasActiveTab = key;
                renderCanvasTabs();
                if (canvasActiveTab === key) renderCanvasBody();
            }

            function buildPreviewDoc() {
                // Prefer an index.html-ish entry point; otherwise the first previewable file.
                const entries = Array.from(canvasFiles.entries());
                let htmlEntry = entries.find(([name]) => /(^|\/)index\.html?$/i.test(name));
                if (!htmlEntry) htmlEntry = entries.find(([name, f]) => isPreviewableFile(name, f.language));
                if (!htmlEntry) return '';
                let [, file] = htmlEntry;
                let html = file.content || '';
                // Inline same-session <link rel="stylesheet" href="..."> and
                // <script src="..."> files so the preview works standalone in the
                // sandboxed iframe (no real static file server behind it).
                html = html.replace(/<link[^>]+rel=["']stylesheet["'][^>]*href=["']([^"']+)["'][^>]*>/gi, (m, href) => {
                    const match = entries.find(([name]) => name.endsWith(href.replace(/^\.?\//, '')));
                    return match ? `<style>\n${match[1].content}\n</style>` : m;
                });
                html = html.replace(/<script[^>]+src=["']([^"']+)["'][^>]*><\/script>/gi, (m, src) => {
                    const match = entries.find(([name]) => name.endsWith(src.replace(/^\.?\//, '')));
                    return match ? `<script>\n${match[1].content}\n<\/script>` : m;
                });
                return html;
            }

            function renderCanvasTabs() {
                if (!canvasEl) return;
                const tabsEl = canvasEl.querySelector('.response-canvas-tabs');
                tabsEl.replaceChildren();
                canvasFiles.forEach((file, key) => {
                    const tab = document.createElement('button');
                    tab.type = 'button';
                    tab.className = 'response-canvas-tab' + (canvasActiveTab === key ? ' active' : '');
                    tab.innerHTML = (file.streaming ? '<span class="response-canvas-tab-spinner"></span>' : '') +
                        `<span class="response-canvas-tab-name">${escapeHtml(canvasFileLabel(key))}</span>` +
                        (file.additions ? `<span class="response-canvas-tab-stat-add">+${file.additions}</span>` : '') +
                        (file.deletions ? `<span class="response-canvas-tab-stat-del">-${file.deletions}</span>` : '');
                    tab.addEventListener('click', () => openCanvasTab(key));
                    tabsEl.appendChild(tab);
                });
                const previewTab = document.createElement('button');
                previewTab.type = 'button';
                previewTab.className = 'response-canvas-tab response-canvas-preview-tab' + (canvasActiveTab === '__preview__' ? ' active' : '');
                previewTab.innerHTML = `<span class="response-canvas-tab-name">Preview</span>`;
                const previewable = buildPreviewDoc();
                previewTab.disabled = !previewable;
                previewTab.addEventListener('click', () => openCanvasTab('__preview__'));
                tabsEl.appendChild(previewTab);
            }

            function renderCanvasBody() {
                if (!canvasEl) return;
                const codeEl = canvasEl.querySelector('.response-canvas-diff'); // repurposed: plain code pane, not a colored diff
                const previewEl = canvasEl.querySelector('.response-canvas-preview');
                if (canvasActiveTab === '__preview__') {
                    codeEl.hidden = true;
                    previewEl.classList.add('active');
                    const doc = buildPreviewDoc();
                    previewEl.querySelector('iframe').srcdoc = doc || '<p style="font:13px sans-serif;color:#888;padding:16px;">Nothing to preview yet.</p>';
                    return;
                }
                previewEl.classList.remove('active');
                codeEl.hidden = false;
                const file = canvasFiles.get(canvasActiveTab);
                codeEl.replaceChildren();
                const pre = document.createElement('pre');
                pre.className = 'response-canvas-code-pre';
                const code = document.createElement('code');
                code.className = `language-${(file && file.language ? file.language : 'plaintext').toLowerCase()}`;
                code.textContent = file && file.content ? file.content : (file && file.streaming ? 'Generating…' : 'No content yet.');
                pre.appendChild(code);
                codeEl.appendChild(pre);
                if (window.hljs && file && file.content) {
                    try { window.hljs.highlightElement(code); } catch (e) { /* non-fatal */ }
                }
            }

            function openCanvasTab(filename) {
                if (!canvasEl) return;
                const key = filename === undefined || filename === null ? '' : filename;
                if (key !== '__preview__' && !canvasFiles.has(key)) return;
                canvasActiveTab = key;
                canvasEl.hidden = false;
                renderCanvasTabs();
                renderCanvasBody();
                canvasEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            function renderCanvasFromResult(result = {}) {
                if (!canvasEl) return;
                const activities = Array.isArray(result.activities) ? result.activities : [];
                const fileContents = result.files && Object.keys(result.files).length
                    ? result.files
                    : (result.code ? { '': result.code } : {});
                let sawAny = false;
                activities.filter(a => a.kind === 'edit').forEach((activity) => {
                    const key = activity.filename !== undefined ? activity.filename : '';
                    upsertCanvasFile(key, {
                        language: (result.file_languages && result.file_languages[key]) || result.language || '',
                        additions: activity.additions || 0,
                        deletions: activity.deletions || 0,
                        diffLines: activity.diff_lines || [],
                        content: fileContents[key] !== undefined ? fileContents[key] : '',
                        streaming: false,
                    });
                    sawAny = true;
                });
                // Fallback for results with no activities array (older payload shape):
                // still show whatever files came back, without diff stats.
                if (!sawAny) {
                    Object.entries(fileContents).forEach(([key, content]) => {
                        upsertCanvasFile(key, {
                            language: (result.file_languages && result.file_languages[key]) || result.language || '',
                            content,
                            streaming: false,
                        });
                    });
                }
                // Data is populated so the canvas is *ready* the moment the user clicks a
                // file card or an edited-file row — but it stays hidden until they do.
                // No auto-opening after a response.
            }

            function downloadTextFile(filename, content) {
                const blob = new Blob([content || ''], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename || 'generated-file.txt';
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }

            async function downloadAllFiles(entries) {
                if (!entries.length) return;
                if (entries.length === 1) {
                    downloadTextFile(entries[0].filename, entries[0].content);
                    return;
                }
                // Zip client-side when JSZip is available (no backend/workspace involved);
                // otherwise fall back to triggering each download individually.
                if (window.JSZip) {
                    const zip = new JSZip();
                    entries.forEach((entry) => zip.file(entry.filename, entry.content || ''));
                    const blob = await zip.generateAsync({ type: 'blob' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'generated-code.zip';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                } else {
                    entries.forEach((entry) => downloadTextFile(entry.filename, entry.content));
                }
            }

            function renderFileCards(result = {}) {
                if (!fileCardsEl) return;
                const hasFiles = result.files && Object.keys(result.files).length > 0;
                const statsByFile = new Map(
                    (Array.isArray(result.activities) ? result.activities : [])
                        .filter(a => a.kind === 'edit')
                        .map(a => [a.filename !== undefined ? a.filename : '', { additions: a.additions || 0, deletions: a.deletions || 0 }])
                );
                const entries = hasFiles
                    ? Object.entries(result.files).map(([filename, content]) => ({
                        filename,
                        canvasKey: filename,
                        content: String(content || ''),
                        language: (result.file_languages && result.file_languages[filename]) || '',
                    }))
                    : (result.code ? [{ filename: `generated.${result.language || 'txt'}`, canvasKey: '', content: String(result.code), language: result.language || '' }] : []);
                if (!entries.length) {
                    fileCardsEl.hidden = true;
                    return;
                }
                fileCardsEl.hidden = false;
                const listEl = fileCardsEl.querySelector('.response-file-card-list');
                listEl.replaceChildren();
                entries.forEach((entry) => {
                    const extension = (entry.filename.split('.').pop() || '').toLowerCase();
                    const isCode = CODE_EXTENSIONS.has(extension) || CODE_EXTENSIONS.has((entry.language || '').toLowerCase());
                    const stats = statsByFile.get(entry.canvasKey);
                    const statsHtml = stats
                        ? (stats.additions ? `<span class="response-workflow-add">+${stats.additions}</span>` : '') +
                          (stats.deletions ? `<span class="response-workflow-del">-${stats.deletions}</span>` : '')
                        : '';
                    const card = document.createElement('div');
                    card.className = 'response-file-card';
                    card.innerHTML = `
                        <span class="response-file-card-icon">${isCode ? FILE_ICON.code : FILE_ICON.plain}</span>
                        <span class="response-file-card-meta">
                            <div class="response-file-card-name"></div>
                            <div class="response-file-card-type">${isCode ? `Code · ${extension.toUpperCase()}` : extension.toUpperCase()}${statsHtml}</div>
                        </span>
                        <button type="button" class="response-file-card-download">Download</button>
                    `;
                    card.querySelector('.response-file-card-name').textContent = entry.filename;
                    card.querySelector('.response-file-card-download').addEventListener('click', (evt) => {
                        evt.stopPropagation();
                        downloadTextFile(entry.filename, entry.content);
                    });
                    // Clicking the card body (anywhere but Download) opens this file
                    // in the preview canvas below — the canvas is only ever shown on
                    // this kind of explicit click, never automatically.
                    card.addEventListener('click', () => openCanvasTab(entry.canvasKey));
                    listEl.appendChild(card);
                });
                const downloadAllBtn = fileCardsEl.querySelector('.response-file-cards-download-all');
                downloadAllBtn.style.display = entries.length > 1 ? '' : 'none';
                downloadAllBtn.onclick = () => downloadAllFiles(entries);
                scrollToBottom();
            }

            function finalizeCodeResult(result = {}) {
                renderWorkflow(result.activities, result.activity_summary);
                renderFileCards(result);
                renderCanvasFromResult(result);
            }

            // Lives outside .message-prose so setProse() re-parsing the prose HTML
            // on every streamed token never touches it — see createThinkingIndicator.
            let indicatorEl = null;
            setProse(textContainer, '');
            indicatorEl = createThinkingIndicator('thinking');
            textContainer.appendChild(indicatorEl);

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('Network response was not ok');

                if (useStream) {
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });

                        const events = buffer.split('\n\n');
                        buffer = events.pop();

                        for (const event of events) {
                            const line = event.trim();
                            if (!line.startsWith('data:')) continue;

                            const jsonStr = line.slice(5).trim();
                            try {
                                const parsed = JSON.parse(jsonStr);
                                if (parsed.type === 'status') {
                                    // Backend node narration ("chat_understand_node", "Invoking the
                                    // model with...", etc.) is intentionally not shown here anymore —
                                    // the Thinking panel now only ever displays the model's own real
                                    // reasoning trace (see the 'thought' branch below), matching
                                    // Claude.ai instead of a synthesized step-by-step log.
                                } else if (parsed.type === 'thought') {
                                    appendLiveThought(parsed.text);
                                } else if (parsed.type === 'agent_message' && mode === 'code') {
                                    // Per-turn "what I'm about to do" narration from the
                                    // code agent — goes in the activity/thinking panel,
                                    // never in the main answer bubble (that's the
                                    // 'message'/assistant_message branch below, which now
                                    // only carries the real final_message answer).
                                    if (parsed.text) addThought(parsed.text, parsed.text, 'note');
                                } else if (parsed.type === 'plan_created' && mode === 'code') {
                                    // Claude-like plan: show steps early in the activity feed before edits stream
                                    if (workflowEl && Array.isArray(parsed.steps) && parsed.steps.length) {
                                        workflowEl.hidden = false;
                                        const listEl = workflowEl.querySelector('.response-workflow-list');
                                        parsed.steps.forEach((stepText) => {
                                            const row = createWorkflowRow({ kind: 'plan', text: stepText });
                                            listEl.appendChild(row);
                                        });
                                        scrollToBottom();
                                    }
                                } else if (parsed.type === 'RETRY' || parsed.type === 'ERROR') {
                                    addThought(parsed.type === 'ERROR' ? 'Code generation error' : 'Retrying', parsed.message || parsed.reason || '', parsed.type.toLowerCase());
                                } else if (parsed.type === 'code_start') {
                                    // No-op: code_file_start (below) is what creates the tab.
                                } else if (parsed.type === 'code_delta' && mode === 'code') {
                                    // Live file content, streamed as the model generates it.
                                    // Append to whatever's already in the panel rather than
                                    // replacing it, so the pane fills in smoothly instead of
                                    // jumping once at the very end of the turn.
                                    const key = currentStreamFileKey || '';
                                    const existing = canvasFiles.get(key);
                                    const nextContent = (existing && existing.content ? existing.content : '') + (parsed.text || '');
                                    upsertCanvasFile(key, { content: nextContent, streaming: true });
                                } else if (parsed.type === 'code_file_start' && mode === 'code') {
                                    // A new file just started streaming: show its tab immediately with
                                    // a spinner, before any diff/counts are known yet.
                                    const key = parsed.filename || '';
                                    currentStreamFileKey = key;
                                    upsertCanvasFile(key, { language: parsed.language || '', streaming: true });
                                    // Also grow the activity feed itself live — an "Editing <file>…"
                                    // row appears the instant the file starts, exactly like a Claude
                                    // Code session narrating each edit as it happens, instead of the
                                    // whole feed only popping in at the very end of the turn.
                                    if (workflowEl && !workflowRowsByFile.has(key)) {
                                        workflowEl.hidden = false;
                                        const row = createWorkflowRow({ kind: 'edit', file: canvasFileLabel(key), filename: key, additions: 0, deletions: 0 });
                                        workflowRowsByFile.set(key, row);
                                        workflowEl.querySelector('.response-workflow-list').appendChild(row);
                                        scrollToBottom();
                                    }
                                } else if (parsed.type === 'code_file_diff' && mode === 'code') {
                                    // One file just finished streaming and the backend computed its
                                    // real diff — this is what makes the +added/-removed counts (and
                                    // the diff/preview panel) update live, file by file, instead of
                                    // only once at the very end of the turn.
                                    const key = parsed.filename || '';
                                    if (currentStreamFileKey === key) currentStreamFileKey = null;
                                    upsertCanvasFile(key, {
                                        language: parsed.language || '',
                                        additions: parsed.additions || 0,
                                        deletions: parsed.deletions || 0,
                                        diffLines: parsed.diff_lines || [],
                                        content: parsed.content || '',
                                        streaming: false,
                                    });
                                    // Live-update the matching workflow row's +added/-removed counts
                                    // now that the real diff is known. The final renderWorkflow() call
                                    // still fully rebuilds the feed once the turn completes (adding the
                                    // "Read"/"diff -u" rows and note/plan bullets around this edit), so
                                    // this is purely an early, self-correcting preview.
                                    let row = workflowRowsByFile.get(key);
                                    if (!row && workflowEl) {
                                        // Defensive fallback: create it now if code_file_start's row
                                        // somehow wasn't built yet, so the diff is never lost.
                                        workflowEl.hidden = false;
                                        row = createWorkflowRow({ kind: 'edit', file: canvasFileLabel(key), filename: key, additions: 0, deletions: 0 });
                                        workflowRowsByFile.set(key, row);
                                        workflowEl.querySelector('.response-workflow-list').appendChild(row);
                                    }
                                    if (row) {
                                        const textEl = row.querySelector('span:last-child');
                                        if (textEl) setWorkflowEditRowText(textEl, { file: canvasFileLabel(key), additions: parsed.additions, deletions: parsed.deletions });
                                    }
                                } else if (parsed.type === 'code_result') {
                                    codeResult = parsed;
                                    if (mode === 'code') finalizeCodeResult(parsed);
                                } else if (parsed.type === 'message_reset') {
                                    // Compatibility event: clear the current draft if a server
                                    // explicitly asks the client to reset it.
                                    assistantFullText = '';
                                    setProse(textContainer, '');
                                    if (indicatorEl) indicatorEl.remove();
                                    indicatorEl = createThinkingIndicator('thinking');
                                    textContainer.appendChild(indicatorEl);
                                } else if (parsed.assistant_message) {
                                    if (!answerStarted) {
                                        answerStarted = true;
                                        finishThinking(); // collapse thoughts the instant the answer begins
                                        // First real content token — hand off from "thinking" to
                                        // "listening" on the *same* node so the transition plays.
                                        if (indicatorEl) setThinkingIndicatorState(indicatorEl, 'listening');
                                    }
                                    assistantFullText += parsed.assistant_message;
                                    // In Code mode, never let a fenced code block render inside the
                                    // chat bubble while it's still streaming in — it belongs in the
                                    // response diff box (via code_result below), not typed out as raw text.
                                    scheduleAnswerRender();
                                }
                            } catch (e) {
                                console.error('Failed to parse SSE chunk:', jsonStr, e);
                            }
                        }
                    }

                    const hasCodeResult = codeResult && (codeResult.code || (codeResult.files && Object.keys(codeResult.files).length > 0));
                    if (mode === 'code' && hasCodeResult) {
                        setProse(textContainer, marked.parse(normalizeMathDelimiters(stripCodeFence(assistantFullText))));
                        highlightCode(textContainer);
                        finalizeCodeResult(codeResult);
                    } else {
                        setProse(textContainer, marked.parse(normalizeMathDelimiters(assistantFullText)));
                        highlightCode(textContainer);
                    }

                } else {
                    const data = await response.json();
                    // Only the model's real reasoning (step === 'reasoning', added
                    // server-side in the non-streaming invoke_model() path) belongs in
                    // the Thinking panel — synthetic backend-node narration and the
                    // generic thinking_summary line are no longer shown.
                    if (Array.isArray(data.thinking_steps)) {
                        data.thinking_steps
                            .filter(step => step.step === 'reasoning')
                            .forEach(step => addThought(step.label, step.detail, step.step));
                    }
                    assistantFullText = data.response;
                    const hasCode = data && (data.code || (data.files && Object.keys(data.files).length > 0));
                    if (mode === 'code' && hasCode) {
                        setProse(textContainer, marked.parse(normalizeMathDelimiters(stripCodeFence(assistantFullText))));
                        highlightCode(textContainer);
                        finalizeCodeResult(data);
                    } else {
                        setProse(textContainer, marked.parse(normalizeMathDelimiters(assistantFullText)));
                        highlightCode(textContainer);
                    }
                }

                finishThinking(); // no-op if already collapsed when the answer started

            } catch (error) {
                console.error('Error:', error);
                thinkingBlock.remove();
                textContainer.innerHTML = `<span style="color: var(--text-secondary)">Could not reach the backend: ${DOMPurify.sanitize(error.message || String(error))}</span>`;
            } finally {
                sendBtn.disabled = false;
                isWaitingForResponse = false;
                userInput.focus();
                const cursor = textContainer.querySelector('.thinking-indicator');
                if (cursor) cursor.remove();
                modes[mode].html = chatContent.innerHTML;
            }
        }

        window.onload = () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                if (splash) {
                    splash.classList.add('hidden');
                    setTimeout(() => splash.style.display = 'none', 700);
                }
                document.getElementById('userInput').focus();
            }, 2100);
            updateModelPickerLabel();
        };
    </script>
</body>
</html>
