<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maximus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        :root { --bg-main:#212121; --bg-sidebar:#171717; --bg-input:#2f2f2f; --bg-hover:#2f2f2f; --text-primary:#ececec; --text-secondary:#b4b4b4; --accent:#10a37f; --border-color:rgba(255,255,255,0.1); --transition-bezier:cubic-bezier(0.2,0.8,0.2,1); }
        * { box-sizing:border-box; margin:0; padding:0; font-family:'Inter',sans-serif; }
        body { background-color:var(--bg-main); color:var(--text-primary); display:flex; height:100vh; overflow:hidden; }

        /* ============== SPLASH SCREEN ============== */
        .splash-screen { position:fixed; inset:0; background-color:var(--bg-main); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.7s var(--transition-bezier), visibility 0.7s; }
        .splash-screen.hidden { opacity:0; visibility:hidden; }

        /* Soft ambient color wash breathing behind the mark */
        .splash-logo-wrap { position:relative; display:flex; align-items:center; justify-content:center; margin-bottom:32px; }
        .splash-glow { position:absolute; left:50%; top:50%; width:260px; height:260px; margin:-130px 0 0 -130px; border-radius:50%; background:radial-gradient(circle, rgba(196,113,237,0.28), rgba(79,172,254,0.14) 45%, transparent 72%); filter:blur(22px); opacity:0; animation:splashGlowIn 1.1s ease-out 0.05s forwards, splashGlowPulse 3s ease-in-out 1.3s infinite; pointer-events:none; }
        @keyframes splashGlowIn { to { opacity:1; } }
        @keyframes splashGlowPulse { 0%,100% { transform:scale(1); opacity:0.85; } 50% { transform:scale(1.15); opacity:1; } }

        /* One-shot shockwave ring that fires the instant the mark locks together */
        .splash-shock { position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.55); opacity:0; animation:splashShock 0.65s cubic-bezier(0.2,0.8,0.2,1) 0.52s forwards; pointer-events:none; }
        @keyframes splashShock { 0% { transform:scale(0.35); opacity:0.85; } 100% { transform:scale(3); opacity:0; } }

        /* Logo: pops in with a springy overshoot, then assembles from its three parts, then breathes gently */
        .splash-logo-container { position:relative; z-index:1; width:96px; height:96px; opacity:0; transform:scale(0.5) rotate(-8deg); animation:splashLogoIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.03s forwards, splashLogoBreathe 2.8s ease-in-out 1.3s infinite; }
        .splash-logo { width:100%; height:100%; display:block; }
        @keyframes splashLogoIn { to { opacity:1; transform:scale(1) rotate(0deg); } }
        @keyframes splashLogoBreathe { 0%,100% { transform:scale(1); filter:drop-shadow(0 0 0 rgba(196,113,237,0)); } 50% { transform:scale(1.05); filter:drop-shadow(0 0 16px rgba(196,113,237,0.4)); } }

        .logo-part { opacity:0; transform-box:fill-box; transform-origin:center; }
        .logo-leg-right { transform:translate(34px,-44px) rotate(-30deg) scale(0.6); animation:splashLegIn 0.55s cubic-bezier(0.34,1.56,0.64,1) 0.14s forwards; }
        .logo-leg-left { transform:translate(-34px,-44px) rotate(30deg) scale(0.6); animation:splashLegIn 0.55s cubic-bezier(0.34,1.56,0.64,1) 0.22s forwards; }
        .logo-bar { transform:scaleX(0) scaleY(0.3); animation:splashBarIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards; }
        @keyframes splashLegIn { to { opacity:1; transform:translate(0,0) rotate(0deg) scale(1); } }
        @keyframes splashBarIn { to { opacity:1; transform:scaleX(1) scaleY(1); } }

        /* Wordmark: letters pop in tinted with the logo's own palette, settle to neutral, then a light sweep loops across */
        .splash-text { position:relative; display:inline-flex; overflow:hidden; padding:0 2px; font-size:16px; font-weight:500; letter-spacing:4px; text-transform:uppercase; }
        .splash-text span { display:inline-block; opacity:0; filter:blur(5px); transform:translateY(12px) scale(0.85); color:var(--c); animation:splashLetterIn 0.5s cubic-bezier(0.2,0.8,0.2,1) forwards; animation-delay:calc(0.62s + var(--i) * 0.045s); }
        @keyframes splashLetterIn { 0% { opacity:0; filter:blur(5px); transform:translateY(12px) scale(0.85); } 55% { opacity:1; filter:blur(0); transform:translateY(0) scale(1.08); } 100% { opacity:0.9; filter:blur(0); transform:translateY(0) scale(1); color:var(--text-secondary); } }
        .splash-text::after { content:''; position:absolute; top:0; left:-160%; width:60%; height:100%; background:linear-gradient(100deg, transparent, rgba(255,255,255,0.5), transparent); animation:splashShimmer 2.4s ease-in-out 1.6s infinite; }
        @keyframes splashShimmer { 0% { left:-160%; } 55%,100% { left:160%; } }

        /* ============== SIDEBAR ============== */
        .sidebar { width:260px; background-color:var(--bg-sidebar); display:flex; flex-direction:column; padding:10px; border-right:1px solid var(--border-color); transition:width 0.3s var(--transition-bezier), padding 0.3s var(--transition-bezier), opacity 0.3s var(--transition-bezier); overflow-x:hidden; white-space:nowrap; flex-shrink:0; }
        .sidebar.collapsed { width:0; padding-left:0; padding-right:0; border-right:none; opacity:0; }
        .sidebar-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:10px; }
        .icon-btn { background:transparent; border:none; color:var(--text-secondary); cursor:pointer; padding:8px; border-radius:6px; display:flex; align-items:center; justify-content:center; transition:background 0.2s ease, color 0.2s ease, transform 0.15s ease; }
        .icon-btn:hover { background-color:var(--bg-hover); color:var(--text-primary); }
        .icon-btn:active { transform:scale(0.92); }
        .new-chat-btn { flex:1; display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background-color:transparent; color:var(--text-primary); border:1px solid var(--border-color); border-radius:8px; cursor:pointer; font-size:14px; font-weight:500; transition:background 0.2s ease, transform 0.15s ease; }
        .new-chat-btn:hover { background-color:var(--bg-hover); }
        .new-chat-btn:active { transform:scale(0.98); }
        .history-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:5px; }
        .history-item { padding:12px; border-radius:8px; cursor:pointer; font-size:14px; overflow:hidden; text-overflow:ellipsis; color:var(--text-secondary); transition:background 0.2s, color 0.2s; }
        .history-item:hover { background-color:var(--bg-hover); color:var(--text-primary); }
        .sidebar-settings { margin-top:auto; padding-top:16px; border-top:1px solid var(--border-color); display:flex; flex-direction:column; gap:12px; }
        .settings-panel { display:flex; flex-direction:column; gap:12px; animation:fadeInSettings 0.25s ease; }
        @keyframes fadeInSettings { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
        .settings-panel[hidden] { display:none; }
        .sidebar-setting-item { display:flex; justify-content:space-between; align-items:center; color:var(--text-secondary); font-size:13px; gap:10px; }
        .sidebar-setting-item input[type="number"] { width:50px; background-color:var(--bg-main); color:var(--text-primary); border:1px solid transparent; padding:4px 8px; border-radius:6px; outline:none; transition:background 0.2s, border-color 0.2s; }
        .sidebar-setting-item input[type="number"]:hover, .sidebar-setting-item input[type="number"]:focus { background-color:var(--bg-hover); border-color:rgba(255,255,255,0.2); }
        .sidebar-setting-item input[type="checkbox"] { width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }
        .sidebar-setting-item select { background-color:var(--bg-main); color:var(--text-primary); border:1px solid transparent; padding:4px 8px; border-radius:6px; outline:none; font-size:13px; cursor:pointer; transition:background 0.2s, border-color 0.2s; max-width:150px; }
        .sidebar-setting-item select:hover, .sidebar-setting-item select:focus { background-color:var(--bg-hover); border-color:rgba(255,255,255,0.2); }

        /* ============== HEADER + MODE TOGGLE ============== */
        .main-content { flex:1; display:flex; flex-direction:column; position:relative; min-width:0; }
        .header { height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; z-index:10; }
        .header-left { display:flex; align-items:center; gap:12px; }
        .sidebar-toggle-main { display:none; opacity:0; transform:scale(0.8); transition:opacity 0.3s var(--transition-bezier), transform 0.3s var(--transition-bezier); }
        .sidebar.collapsed ~ .main-content .sidebar-toggle-main { display:flex; opacity:1; transform:scale(1); }

        .mode-toggle { display:flex; align-items:center; background-color:var(--bg-input); border-radius:999px; padding:3px; position:relative; }
        .mode-toggle button { position:relative; z-index:1; border:none; background:transparent; color:var(--text-secondary); font-size:13px; font-weight:500; padding:7px 16px; border-radius:999px; cursor:pointer; transition:color 0.25s ease; display:flex; align-items:center; gap:6px; }
        .mode-toggle button svg { width:14px; height:14px; }
        .mode-toggle button.active { color:var(--bg-main); }
        .mode-toggle-pill { position:absolute; top:3px; left:3px; height:calc(100% - 6px); width:calc(50% - 3px); background-color:var(--text-primary); border-radius:999px; transition:transform 0.3s var(--transition-bezier); z-index:0; }
        .mode-toggle.code-active .mode-toggle-pill { transform:translateX(100%); }

        /* ============== CHAT AREA (simplified) ============== */
        .chat-container { flex:1; overflow-y:auto; display:flex; flex-direction:column; align-items:center; scroll-behavior:smooth; }
        .chat-content { width:100%; max-width:760px; padding:20px; display:flex; flex-direction:column; gap:26px; padding-bottom:150px; }
        .opening-scene { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; width:100%; text-align:center; padding:0 20px; }
        .mono-logo-container { margin-bottom:20px; opacity:0; transform:scale(0.85) translateY(15px); animation:popFadeIn 0.6s var(--transition-bezier) forwards; }
        .mono-logo { width:56px; height:56px; color:var(--text-primary); }
        .swirl-spin { animation:spin 3s linear infinite; }
        .opening-title { font-size:24px; font-weight:600; margin-bottom:10px; opacity:0; transform:translateY(12px); animation:slideFadeIn 0.6s var(--transition-bezier) 0.1s forwards; transition:opacity 0.2s ease; }
        .opening-subtitle { color:var(--text-secondary); font-size:14px; opacity:0; transform:translateY(12px); animation:slideFadeIn 0.6s var(--transition-bezier) 0.2s forwards; transition:opacity 0.2s ease; }
        @keyframes popFadeIn { to { opacity:1; transform:scale(1) translateY(0); } }
        @keyframes slideFadeIn { to { opacity:1; transform:translateY(0); } }

        .message-row { display:flex; width:100%; opacity:0; transform:translateY(10px); animation:slideFadeIn 0.4s var(--transition-bezier) forwards; }
        .message-row.user { justify-content:flex-end; }
        .message-row.assistant { justify-content:flex-start; }
        .message-bubble { max-width:88%; padding:14px 18px; font-size:15px; line-height:1.6; }
        .user .message-bubble { background-color:var(--bg-input); border-radius:20px 20px 6px 20px; white-space:pre-wrap; }

        /* Simplified assistant message: no repeated title per bubble, just a small quiet avatar */
        .assistant .message-bubble { background-color:transparent; border-radius:8px; color:var(--text-primary); display:flex; gap:12px; padding-left:0; align-items:flex-start; }
        .assistant-avatar { flex-shrink:0; width:26px; height:26px; padding:5px; border-radius:50%; border:1px solid var(--border-color); color:var(--text-secondary); margin-top:2px; position:relative; overflow:hidden; }
        /* Nexus-spark logo scaled down to sit inside the round avatar slot — same
           technique as .thinking-indicator below: the 280x280 logo is kept at its
           original authored size and shrunk with a CSS transform so nothing about
           it (blur radii, stroke widths, colors) needed to be re-tuned. Positioned
           absolutely (not flex-centered) because a flex parent shrinks a fixed-width
           flex child to fit BEFORE the scale transform applies, compounding the two
           shrinks and leaving only the core dot visible — absolute positioning keeps
           the 280px box at its true authored size so the transform is the only thing
           scaling it. */
        .assistant-avatar .logo-container { position:absolute; top:50%; left:50%; width:280px; height:280px; display:flex; justify-content:center; align-items:center; transform:translate(-50%,-50%) scale(0.093); transform-origin:center; }
        .assistant-avatar .ai-svg { width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 30px rgba(139,92,246,0.2)); transition:filter 0.5s ease; }
        .assistant-avatar .spark-group { transform-origin:50px 50px; transition:all 0.5s cubic-bezier(0.4,0,0.2,1); }
        .assistant-avatar .core-dot { transform-origin:50px 50px; transition:all 0.5s cubic-bezier(0.4,0,0.2,1); }
        .assistant-avatar .state-thinking .ai-svg { filter:drop-shadow(0 0 50px rgba(236,72,153,0.4)); }
        .assistant-avatar .state-thinking .spark-primary { animation:think-spin-primary 3s cubic-bezier(0.68,-0.55,0.265,1.55) infinite; }
        .assistant-avatar .state-thinking .spark-secondary { animation:think-spin-secondary 4s cubic-bezier(0.68,-0.55,0.265,1.55) infinite; }
        .assistant-avatar .state-thinking .core-dot { animation:think-core 1.5s ease-in-out infinite; fill:#ec4899; }
        .assistant-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:10px; }

        .message-text { word-break:break-word; }
        .message-text p { margin-bottom:12px; }
        .message-text p:last-child { margin-bottom:0; }
        .message-text h1, .message-text h2, .message-text h3, .message-text h4 { margin:18px 0 8px 0; font-weight:600; color:#fff; }
        .message-text h1 { font-size:1.4em; }
        .message-text h2 { font-size:1.25em; }
        .message-text h3 { font-size:1.1em; }
        .message-text ul, .message-text ol { margin:10px 0; padding-left:22px; }
        .message-text li { margin-bottom:6px; }
        .message-text table { width:100%; border-collapse:collapse; margin:14px 0; background-color:rgba(0,0,0,0.15); border-radius:8px; overflow:hidden; display:block; overflow-x:auto; }
        .message-text th, .message-text td { border:1px solid var(--border-color); padding:9px 13px; text-align:left; }
        .message-text th { background-color:rgba(255,255,255,0.05); font-weight:600; }

        /* Links inside an assistant answer — plain browser blue/underline would clash
           with the dark theme, so style them to match the accent color instead. Applies
           to every link in a message, including the "Sources" list appended below when
           Chat Mode's web search runs for a turn (see build_web_sources_markdown in
           app.py) — no separate class needed since regular Markdown links use the same
           look. */
        .message-text a { color:var(--accent); text-decoration:none; border-bottom:1px solid transparent; transition:border-color 0.15s ease; word-break:break-word; }
        .message-text a:hover { border-bottom-color:var(--accent); }

        /* The "---" divider + "Sources"/"Images" heading that Chat Mode appends after a
           turn that used web search. Just a lighter horizontal rule and slightly muted
           section labels — the links/list themselves reuse the existing ol/li styles above. */
        .message-text hr { border:none; border-top:1px solid var(--border-color); margin:18px 0 14px 0; }

        /* Image thumbnails from Chat Mode's web image search render as plain <img> tags
           inside a paragraph (via Markdown ![]()) — without sizing, a raw search-result
           image could be arbitrarily large and blow out the whole chat bubble. Capped to
           a small, consistent thumbnail, laid out in a wrapping row, each one clickable
           through to its source (the surrounding <a>, already produced by
           build_web_sources_markdown). */
        .message-text p:has(> a > img), .message-text p:has(> img) { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
        .message-text img { max-width:150px; max-height:110px; width:auto; height:auto; object-fit:cover; border-radius:10px; border:1px solid var(--border-color); background-color:var(--bg-input); display:block; transition:opacity 0.15s ease, border-color 0.15s ease; }
        .message-text a:has(> img) { border-bottom:none; line-height:0; }
        .message-text a:has(> img):hover img { opacity:0.85; border-color:rgba(255,255,255,0.3); }

        .message-text .code-card { margin:14px 0; border-radius:10px; overflow:hidden; border:1px solid var(--border-color); }
        .message-text .code-card-header { display:flex; justify-content:space-between; align-items:center; background-color:#2a2a2a; padding:8px 16px; font-size:12px; color:var(--text-secondary); border-bottom:1px solid var(--border-color); }
        .message-text .code-card-lang { font-family:'Courier New', Courier, monospace; text-transform:lowercase; }
        .message-text .artifact-tabs { display:flex; gap:2px; }
        .message-text .artifact-tab { background:transparent; border:none; color:var(--text-secondary); font-size:12px; padding:4px 10px; border-radius:6px; cursor:pointer; transition:background 0.2s, color 0.2s; }
        .message-text .artifact-tab:hover { color:var(--text-primary); }
        .message-text .artifact-tab.active { background-color:var(--bg-input); color:var(--text-primary); }
        .message-text .artifact-preview { background-color:#ffffff; padding:24px; display:flex; align-items:center; justify-content:center; overflow:auto; }
        .message-text .artifact-preview svg { max-width:100%; height:auto; }
        .message-text .artifact-preview.code-preview-frame { padding:0; display:block; }
        .message-text .code-preview-frame iframe { width:100%; min-height:360px; border:none; display:block; background:#fff; }
        .message-text .code-card [hidden] { display:none !important; }
        .message-text .copy-btn { display:flex; align-items:center; gap:6px; background:transparent; border:none; color:var(--text-secondary); font-size:12px; cursor:pointer; padding:4px 8px; border-radius:6px; transition:background 0.2s, color 0.2s; }
        .message-text .copy-btn:hover { background-color:var(--bg-hover); color:var(--text-primary); }
        .message-text .copy-btn svg { width:14px; height:14px; }
        .message-text pre { background-color:#111; padding:16px; overflow-x:auto; margin:0; border:none; border-radius:0; }
        .message-text code { font-family:'Courier New', Courier, monospace; background-color:rgba(255,255,255,0.1); padding:2px 6px; border-radius:4px; font-size:0.9em; }
        .message-text pre code { background-color:transparent; padding:0; font-size:0.9em; border:none; }
        .message-text blockquote { border-left:4px solid var(--accent); padding-left:12px; color:var(--text-secondary); margin:12px 0; }

        /* ============== CODE MODE: workflow trace (steps) ============== */
        .response-workflow { margin-top:10px; padding-top:2px; }
        .response-workflow[hidden] { display:none; }
        .response-workflow-summary { color:var(--text-secondary); font:12px 'Inter',sans-serif; margin:0 0 8px; }
        .response-workflow-list { display:flex; flex-direction:column; gap:7px; }
        .response-workflow-row { display:flex; align-items:flex-start; gap:8px; font:13px/1.45 'Inter',sans-serif; color:var(--text-secondary); }
        .response-workflow-icon { flex:0 0 16px; width:16px; height:16px; margin-top:1px; display:flex; align-items:center; justify-content:center; color:var(--text-secondary); }
        .response-workflow-icon svg { width:14px; height:14px; }
        .response-workflow-row.note .response-workflow-icon { color:#8b949e; }
        .response-workflow-row.edit .response-workflow-icon { color:#79c0ff; }
        .response-workflow-row.view .response-workflow-icon { color:#8b949e; }
        .response-workflow-row.plan .response-workflow-icon { color:#8b949e; }
        .response-workflow-row.command .response-workflow-icon { color:#d2a8ff; }
        .response-workflow-row.working .response-workflow-icon { color:var(--accent); }
        .response-workflow-note-text { color:var(--text-primary); font-weight:600; }
        .response-workflow-note-text code { font:12px 'Courier New', Courier, monospace; background:var(--bg-hover); border:1px solid var(--border-color); border-radius:4px; padding:1px 5px; color:var(--text-primary); font-weight:400; }
        .response-workflow-edit-file { color:var(--text-primary); font:12.5px 'Courier New', Courier, monospace; }
        .response-workflow-add { color:#3fb950; font:12.5px 'Courier New', Courier, monospace; margin-left:6px; }
        .response-workflow-del { color:#f85149; font:12.5px 'Courier New', Courier, monospace; margin-left:4px; }
        .response-workflow-plain { color:var(--text-secondary); }
        .response-workflow-plain code { font:12px 'Courier New', Courier, monospace; background:var(--bg-hover); border:1px solid var(--border-color); border-radius:4px; padding:1px 5px; color:var(--text-primary); }
        .response-workflow-command-text { color:#d2a8ff; font:12.5px 'Courier New', Courier, monospace; }
        .code-mode-message .message-prose,
        .code-mode-message .message-prose p { font-weight:600; color:var(--text-primary); }

        /* ============== CODE MODE: downloadable file cards ============== */
        .response-file-cards { margin-top:14px; }
        .response-file-cards[hidden] { display:none; }
        .response-file-card-list { display:flex; flex-direction:column; gap:8px; }
        .response-file-card { display:flex; align-items:center; gap:12px; padding:11px 14px; border:1px solid var(--border-color); border-radius:10px; background-color:var(--bg-hover); }
        .response-file-card-icon { flex:0 0 34px; width:34px; height:34px; border-radius:8px; background-color:var(--bg-main); display:flex; align-items:center; justify-content:center; color:var(--text-secondary); }
        .response-file-card-icon svg { width:16px; height:16px; }
        .response-file-card-meta { flex:1 1 auto; min-width:0; }
        .response-file-card-name { color:var(--text-primary); font:13.5px 'Inter',sans-serif; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .response-file-card-type { color:var(--text-secondary); font:11.5px 'Inter',sans-serif; margin-top:2px; }
        .response-file-card-download { flex:0 0 auto; border:1px solid var(--border-color); border-radius:7px; padding:6px 13px; background:var(--bg-main); color:var(--text-primary); font:12.5px 'Inter',sans-serif; font-weight:500; cursor:pointer; }
        .response-file-card-download:hover { background-color:var(--bg-input); }
        .response-file-cards-download-all { margin-top:10px; display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border-color); border-radius:7px; padding:7px 14px; background:var(--bg-hover); color:var(--text-primary); font:12.5px 'Inter',sans-serif; font-weight:500; cursor:pointer; }
        .response-file-cards-download-all:hover { background-color:var(--bg-input); }
        .response-file-cards-download-all svg { width:14px; height:14px; }
        .response-file-card { cursor:pointer; }
        .response-file-card:hover { background-color:var(--bg-input); }

        /* ============== CODE MODE: live diff + preview canvas ============== */
        .response-canvas { margin-top:14px; border:1px solid var(--border-color); border-radius:10px; overflow:hidden; background-color:var(--bg-main); }
        .response-canvas[hidden] { display:none; }
        .response-canvas-tabs { display:flex; align-items:center; gap:2px; padding:7px 7px 0; background-color:var(--bg-hover); overflow-x:auto; }
        .response-canvas-tab { display:flex; align-items:center; gap:6px; border:1px solid transparent; border-bottom:0; border-radius:7px 7px 0 0; padding:6px 11px; background:transparent; color:var(--text-secondary); font:12.5px 'Inter',sans-serif; cursor:pointer; white-space:nowrap; }
        .response-canvas-tab:hover:not(:disabled) { color:var(--text-primary); }
        .response-canvas-tab.active { color:var(--text-primary); background-color:var(--bg-main); border-color:var(--border-color); }
        .response-canvas-tab:disabled { opacity:0.4; cursor:not-allowed; }
        .response-canvas-tab-name { font:12px 'Courier New', Courier, monospace; }
        .response-canvas-tab-stat-add { color:#3fb950; font-size:11px; }
        .response-canvas-tab-stat-del { color:#f85149; font-size:11px; margin-left:2px; }
        .response-canvas-preview-tab { margin-left:auto; }
        .response-canvas-tab-spinner { width:9px; height:9px; border-radius:50%; border:1.5px solid var(--text-secondary); border-top-color:transparent; animation:canvasSpin 0.7s linear infinite; flex:0 0 auto; }
        @keyframes canvasSpin { to { transform:rotate(360deg); } }
        .response-canvas-body { max-height:420px; overflow:auto; background-color:#0d0f10; }
        .response-canvas-diff[hidden] { display:none; }
        .response-canvas-diff-line { display:block; min-width:max-content; padding:1px 12px; white-space:pre; font:12px/1.55 'Courier New', Courier, monospace; }
        .response-canvas-diff-line.add { color:#aff5b4; background:rgba(46,160,67,.15); }
        .response-canvas-diff-line.del { color:#ffc1bc; background:rgba(248,81,73,.12); }
        .response-canvas-diff-line.context { color:#8b949e; }
        .response-canvas-empty { padding:16px; color:#7d8590; font:12px/1.5 'Courier New', Courier, monospace; }
        .response-canvas-code-pre { margin:0; padding:14px 16px; color:#c9d1d9; font:12px/1.55 'Courier New', Courier, monospace; white-space:pre; overflow-x:auto; }
        .response-canvas-code-pre code { background:none; padding:0; }
        .response-canvas-preview { display:none; height:420px; background:#fff; }
        .response-canvas-preview.active { display:block; }
        .response-canvas-preview iframe { width:100%; height:100%; border:0; display:block; background:#fff; }


        .thinking-block { margin-top:2px; }
        .thinking-toggle { background:none; border:none; padding:0; font-size:13px; font-family:inherit; color:var(--text-secondary); cursor:pointer; }
        .thinking-toggle:hover { color:var(--text-primary); text-decoration:underline; }
        .thinking-toggle.shimmer {
            background-image: linear-gradient(
                90deg,
                var(--text-secondary) 0%,
                var(--text-secondary) 35%,
                var(--text-primary) 50%,
                var(--text-secondary) 65%,
                var(--text-secondary) 100%
            );
            background-size: 200% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: thinkingShimmer 1.6s linear infinite;
        }
        @keyframes thinkingShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .thinking-content { display:none; margin:10px 0 10px 12px; padding-left:22px; border-left:1px solid var(--border-color); font-size:14px; line-height:1.6; color:var(--text-secondary); }
        .thinking-content.expanded { display:block; }
        .thought-item { position: relative; margin-bottom: 14px; }
        .thought-item:last-child { margin-bottom: 0; }
        .thought-bullet { position: absolute; left: -26.5px; top: 8px; width: 8px; height: 8px; background-color: #555; border-radius: 50%; z-index: 1; }
        .thought-icon-wrapper { position: absolute; left: -34px; top: 0px; width: 24px; height: 24px; background-color: var(--bg-main); display: flex; align-items: center; justify-content: center; z-index: 2; }
        .thought-icon-wrapper svg { width: 20px; height: 20px; color: var(--text-secondary); }
        .thought-node { display:block; margin-bottom:3px; color:var(--text-primary); font-family:'Courier New', Courier, monospace; font-size:11px; letter-spacing:0.02em; opacity:0.78; }
        .thought-content { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
        .thought-content.expanded { -webkit-line-clamp: unset; }
        .show-more-btn { background: none; border: none; color: var(--text-primary); cursor: pointer; font-size: 12px; padding: 4px 0; margin-top: 2px; display: none; opacity: 0.7; }
        .show-more-btn:hover { opacity: 1; text-decoration: underline; }
        .spinner { width:14px; height:14px; border:2px solid var(--text-secondary); border-top:2px solid transparent; border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

        /* ============== LIVE REASONING STREAM ==============
           The model's own <think> trace, streamed into the thinking panel in real
           time as raw tokens arrive — not synthesized status text. One growing,
           internally-scrolling block per turn, styled distinctly (mono, dimmer,
           tighter leading) from the structured step bullets above it, the same way
           Claude.ai's extended-thinking pane reads differently from its tool notes. */
        .thought-live-item .thought-bullet { background-color:var(--accent); animation:liveThoughtPulse 1.3s ease-in-out infinite; }
        @keyframes liveThoughtPulse { 0%,100% { opacity:0.35; transform:scale(0.8); } 50% { opacity:1; transform:scale(1); } }
        .thought-live-content {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
            opacity: 0.95;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 6px;
            scroll-behavior: smooth;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px);
            mask-image: linear-gradient(to bottom, transparent 0, #000 14px);
        }
        .thought-live-content::-webkit-scrollbar { width:4px; }
        .thought-live-content::-webkit-scrollbar-track { background:transparent; }
        .thought-live-content::-webkit-scrollbar-thumb { background-color:rgba(255,255,255,0.15); border-radius:4px; }
        .thought-live-cursor { display:inline-block; width:6px; height:12px; margin-left:1px; vertical-align:-1px; background-color:var(--text-secondary); animation:liveCursorBlink 0.9s step-end infinite; }
        @keyframes liveCursorBlink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }

        /* ============== CODE MODE: build plan card ==============
           Shown once, right before the very first build in a session — a short
           real plan (its own LLM call, its own live reasoning trace) naming
           what will be built and which file(s) it needs, so the manifest
           appears before any code starts streaming. Never shown again once a
           project exists in the session — later turns edit in place instead. */
        .plan-card { display:block; margin:14px 0; padding:12px 14px; border:1px solid var(--border-color); border-radius:12px; background-color:#1c1c1c; max-width:440px; }
        .plan-card-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; color:var(--text-primary); font-size:13px; font-weight:600; }
        .plan-card-header svg { width:15px; height:15px; color:var(--accent); flex-shrink:0; }
        .plan-card-summary { font-size:13.5px; line-height:1.5; color:var(--text-secondary); margin-bottom:10px; }
        .plan-card-files { display:flex; flex-wrap:wrap; gap:6px; }
        .plan-file-chip { display:inline-flex; align-items:center; gap:5px; font-family:'Courier New', Courier, monospace; font-size:12px; background:rgba(255,255,255,0.08); color:var(--text-primary); padding:3px 9px; border-radius:999px; }
        .plan-suggestions { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
        .plan-suggestion-btn { font-size:12.5px; color:var(--text-primary); background:transparent; border:1px solid var(--border-color); border-radius:999px; padding:5px 12px; cursor:pointer; transition:background 0.2s ease, border-color 0.2s ease; }
        .plan-suggestion-btn:hover { background-color:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.25); }

        /* ============== INPUT ============== */
        .input-container { position:absolute; bottom:0; left:0; width:100%; padding:22px; background:linear-gradient(180deg, rgba(33,33,33,0) 0%, var(--bg-main) 40%); display:flex; justify-content:center; }
        .input-box { width:100%; max-width:760px; background-color:var(--bg-input); border-radius:22px; border:1px solid var(--border-color); display:flex; flex-direction:column; align-items:stretch; padding:11px 15px; box-shadow:0 4px 20px rgba(0,0,0,0.15); transition:border-color 0.25s ease, box-shadow 0.25s ease; }
        .input-box:focus-within { border-color:rgba(255,255,255,0.3); box-shadow:0 4px 24px rgba(0,0,0,0.22); }
        .input-box textarea { flex:1; background:transparent; border:none; color:var(--text-primary); font-size:15.5px; resize:none; outline:none; max-height:200px; padding:8px 4px; line-height:1.5; }
        .input-box textarea::placeholder { color:var(--text-secondary); }
        .send-btn { background:var(--text-primary); color:var(--bg-main); border:none; border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:opacity 0.2s, transform 0.2s var(--transition-bezier); flex-shrink:0; }
        .send-btn:hover:not(:disabled) { transform:scale(1.06); }
        .send-btn:active:not(:disabled) { transform:scale(0.94); }
        .send-btn:disabled { opacity:0.3; cursor:not-allowed; }
        .send-btn svg { width:17px; height:17px; }

        /* ============== MODEL / EFFORT PICKER (input-attached, ChatGPT/Claude-style) ============== */
        .composer-toolbar { display:flex; align-items:center; justify-content:space-between; margin-top:6px; padding-top:2px; }
        .model-picker { position:relative; }
        .model-picker-btn { display:flex; align-items:center; gap:6px; background:transparent; border:1px solid var(--border-color); color:var(--text-primary); font-size:13px; font-weight:500; padding:6px 10px 6px 12px; border-radius:999px; cursor:pointer; transition:background 0.2s ease, border-color 0.2s ease; }
        .model-picker-btn:hover { background-color:var(--bg-hover); border-color:rgba(255,255,255,0.2); }
        .model-picker-btn svg { color:var(--text-secondary); flex-shrink:0; }
        .model-picker-sep { color:var(--text-secondary); }
        #modelPickerLevel { color:var(--text-secondary); }
        .model-picker-panel { position:absolute; left:0; bottom:calc(100% + 10px); width:280px; background-color:#262626; border:1px solid var(--border-color); border-radius:14px; box-shadow:0 10px 38px rgba(0,0,0,0.45); padding:6px; z-index:30; animation:pickerPopIn 0.16s var(--transition-bezier); }
        @keyframes pickerPopIn { from { opacity:0; transform:translateY(6px) scale(0.98); } to { opacity:1; transform:translateY(0) scale(1); } }
        .model-picker-panel[hidden] { display:none; }
        .picker-screen[hidden] { display:none; }
        .picker-row { display:flex; align-items:center; justify-content:space-between; width:100%; background:transparent; border:none; text-align:left; padding:9px 10px; border-radius:9px; cursor:pointer; color:var(--text-primary); transition:background 0.15s ease; }
        .picker-row:hover { background-color:var(--bg-hover); }
        .picker-row-nav { font-size:13.5px; }
        .picker-row-right { display:flex; align-items:center; gap:6px; color:var(--text-secondary); font-size:13px; }
        .picker-divider { height:1px; background-color:var(--border-color); margin:6px 6px; }
        .picker-model-row .picker-row-text { display:flex; flex-direction:column; gap:2px; }
        .picker-model-row .picker-row-name { font-size:14px; font-weight:500; color:var(--text-primary); }
        .picker-model-row .picker-row-desc { font-size:12px; color:var(--text-secondary); }
        .picker-check { color:var(--accent); flex-shrink:0; margin-left:8px; }
        .picker-back { display:flex; align-items:center; gap:6px; background:transparent; border:none; color:var(--text-secondary); font-size:12.5px; font-weight:500; padding:6px 8px 10px; cursor:pointer; }
        .picker-back:hover { color:var(--text-primary); }
        .picker-level-desc { font-size:12px; color:var(--text-secondary); line-height:1.5; padding:0 8px 8px; }
        .picker-level-row { font-size:14px; }
        .picker-badge { font-size:10px; color:var(--text-secondary); background-color:rgba(255,255,255,0.08); padding:2px 6px; border-radius:5px; margin-left:8px; }

        /* Claude-like flyout for More models — code mode only. Appears to the right of the main panel like in the screenshot (Sonnet 5 > More models > Opus/Fable list). */
        .model-picker-panel-wrap { position:absolute; left:0; bottom:calc(100% + 10px); display:flex; gap:8px; align-items:flex-end; z-index:30; }
        .model-picker-panel-wrap[hidden] { display:none; }
        .model-picker-panel-wrap .model-picker-panel { position:relative; left:auto; bottom:auto; }
        .picker-more-panel { width:320px; background-color:#262626; border:1px solid var(--border-color); border-radius:14px; box-shadow:0 10px 38px rgba(0,0,0,0.45); padding:6px; animation:pickerPopIn 0.16s var(--transition-bezier); max-height:380px; overflow-y:auto; }
        .picker-more-panel[hidden] { display:none; }
        .picker-more-header { font-size:12px; font-weight:600; color:var(--text-secondary); letter-spacing:0.04em; text-transform:uppercase; padding:8px 10px 6px; }
        .picker-more-item { display:flex; align-items:center; justify-content:space-between; width:100%; background:transparent; border:none; text-align:left; padding:9px 10px; border-radius:9px; cursor:pointer; transition:background 0.15s ease; }
        .picker-more-item:hover { background-color:var(--bg-hover); }
        .picker-more-item-left { display:flex; flex-direction:column; gap:2px; min-width:0; }
        .picker-more-item-name { font-size:14px; font-weight:500; color:var(--text-primary); display:flex; align-items:center; gap:6px; }
        .picker-more-item-desc { font-size:12px; color:var(--text-secondary); }
        .picker-more-badges { display:flex; align-items:center; gap:6px; flex-shrink:0; }
        .picker-badge-strong { font-size:10px; color:#a5b4fc; background:rgba(99,102,241,0.18); border:1px solid rgba(99,102,241,0.3); padding:2px 6px; border-radius:99px; font-weight:600; }
        .picker-badge-fast { font-size:10px; color:var(--text-secondary); background:rgba(255,255,255,0.08); padding:2px 6px; border-radius:99px; }
        .picker-badge-long { font-size:10px; color:#6ee7b7; background:rgba(16,185,129,0.15); border:1px solid rgba(16,185,129,0.25); padding:2px 6px; border-radius:99px; }
        .picker-more-check { color:var(--accent); flex-shrink:0; margin-left:8px; }

        /* Floating "jump to latest" button — only shown once the user has scrolled
           up away from the bottom during a response, exactly like ChatGPT. Clicking
           it (or scrolling back down manually) re-engages auto-scroll. */
        .scroll-to-bottom-btn { position:absolute; left:50%; bottom:130px; transform:translateX(-50%) translateY(10px); width:36px; height:36px; border-radius:50%; background-color:var(--bg-input); border:1px solid var(--border-color); color:var(--text-primary); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,0.25); opacity:0; pointer-events:none; transition:opacity 0.2s ease, transform 0.2s var(--transition-bezier); z-index:5; }
        .scroll-to-bottom-btn.visible { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
        .scroll-to-bottom-btn svg { width:16px; height:16px; }

        /* Nexus-spark indicator. Container is a fixed 30px inline slot; the inner
           .logo-container is kept at its original authored 280x280 box and scaled
           down with a CSS transform, so every value below (blur radii, stroke
           widths, keyframe %, easing curves, colors) is byte-for-byte what was
           provided — nothing was hand-tuned for the smaller size, only shrunk. */
        .thinking-indicator { display:inline-flex; width:30px; height:30px; vertical-align:middle; margin-left:4px; overflow:hidden; }
        .thinking-indicator .logo-container { position:relative; width:280px; height:280px; display:flex; justify-content:center; align-items:center; transform:scale(0.107); transform-origin:center; }
        .thinking-indicator .ai-svg { width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 30px rgba(139,92,246,0.2)); transition:filter 0.5s ease; }
        .thinking-indicator .spark-group { transform-origin:50px 50px; transition:all 0.5s cubic-bezier(0.4,0,0.2,1); }
        .thinking-indicator .core-dot { transform-origin:50px 50px; transition:all 0.5s cubic-bezier(0.4,0,0.2,1); }
        @keyframes think-spin-primary { 0% { transform:rotate(0deg) scale(0.8); } 50% { transform:rotate(180deg) scale(1.1); } 100% { transform:rotate(360deg) scale(0.8); } }
        @keyframes think-spin-secondary { 0% { transform:rotate(45deg) scale(1.1); } 50% { transform:rotate(-135deg) scale(0.8); } 100% { transform:rotate(-315deg) scale(1.1); } }
        @keyframes think-core { 0%, 100% { transform:scale(0.5); opacity:0.5; } 50% { transform:scale(1.5); opacity:1; } }
        @keyframes listen-pulse-primary { 0%, 100% { transform:rotate(45deg) scale(0.95); } 50% { transform:rotate(45deg) scale(1.15); } }
        @keyframes listen-pulse-secondary { 0%, 100% { transform:rotate(0deg) scale(0.85); } 50% { transform:rotate(0deg) scale(1.05); } }
        @keyframes listen-core { 0%, 100% { transform:scale(1); opacity:0.9; } 25% { transform:scale(1.4); opacity:1; } 50% { transform:scale(1.2); opacity:0.9; } 75% { transform:scale(1.4); opacity:1; } }
        .thinking-indicator .state-thinking .ai-svg { filter:drop-shadow(0 0 50px rgba(236,72,153,0.4)); }
        .thinking-indicator .state-thinking .spark-primary { animation:think-spin-primary 3s cubic-bezier(0.68,-0.55,0.265,1.55) infinite; }
        .thinking-indicator .state-thinking .spark-secondary { animation:think-spin-secondary 4s cubic-bezier(0.68,-0.55,0.265,1.55) infinite; }
        .thinking-indicator .state-thinking .core-dot { animation:think-core 1.5s ease-in-out infinite; fill:#ec4899; }
        .thinking-indicator .state-listening .ai-svg { filter:drop-shadow(0 0 40px rgba(56,189,248,0.4)); }
        .thinking-indicator .state-listening .spark-primary { animation:listen-pulse-primary 2s ease-in-out infinite; }
        .thinking-indicator .state-listening .spark-secondary { animation:listen-pulse-secondary 2s ease-in-out infinite 0.2s; }
        .thinking-indicator .state-listening .core-dot { animation:listen-core 2s ease-in-out infinite; fill:#38bdf8; }

        /* Smooth cross-fade when swapping between Chat / Code content */
        .mode-fade-out { animation:modeFadeOut 0.15s ease forwards; }
        .mode-fade-in { animation:modeFadeIn 0.25s ease forwards; }
        @keyframes modeFadeOut { to { opacity:0; transform:translateY(4px); } }
        @keyframes modeFadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

    </style>
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <div class="splash-logo-wrap">
            <div class="splash-glow"></div>
            <div class="splash-shock"></div>
            <div class="splash-logo-container">
                <svg class="splash-logo" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="grad-apex-left" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fa709a"/>
                            <stop offset="100%" stop-color="#fee140"/>
                        </linearGradient>
                        <linearGradient id="grad-apex-right" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#4facfe"/>
                            <stop offset="100%" stop-color="#00f2fe"/>
                        </linearGradient>
                        <linearGradient id="grad-apex-center" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#c471ed"/>
                            <stop offset="100%" stop-color="#f64f59"/>
                        </linearGradient>
                        <filter id="glow-4" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
                        </filter>
                    </defs>
                    <g filter="url(#glow-4)">
                        <!-- Right leg drops in from upper-right -->
                        <g class="logo-part logo-leg-right">
                            <rect x="105" y="30" width="32" height="170" rx="16" transform="rotate(-32, 120, 60)" fill="url(#grad-apex-right)"/>
                        </g>
                        <!-- Left leg drops in from upper-left -->
                        <g class="logo-part logo-leg-left">
                            <rect x="103" y="30" width="32" height="170" rx="16" transform="rotate(32, 120, 60)" fill="url(#grad-apex-left)"/>
                        </g>
                        <!-- Crossbar scales in last, locking the mark together -->
                        <g class="logo-part logo-bar">
                            <rect x="80" y="145" width="80" height="24" rx="12" fill="url(#grad-apex-center)"/>
                        </g>
                    </g>
                </svg>
            </div>
        </div>
        <div class="splash-text">
            <span style="--i:0;--c:#fa709a">M</span><span style="--i:1;--c:#fee140">A</span><span style="--i:2;--c:#4facfe">X</span><span style="--i:3;--c:#00f2fe">I</span><span style="--i:4;--c:#c471ed">M</span><span style="--i:5;--c:#f64f59">U</span><span style="--i:6;--c:#fa709a">S</span>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="icon-btn" onclick="toggleSidebar()" title="Close sidebar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                </svg>
            </button>
            <button class="new-chat-btn" onclick="startNewChat()">
                <span>New session</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"></path>
                </svg>
            </button>
        </div>
        <div class="history-list" id="historyList"></div>
        <div class="sidebar-settings">
            <!-- Chat mode settings — Model, Temperature and Effort moved to the
                 picker attached to the message composer (see input-container below). -->
            <div class="settings-panel" id="chatSettings">
                <div class="sidebar-setting-item">
                    <label title="Stream Response Tokens">Stream Response</label>
                    <input type="checkbox" id="streamSetting" checked>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension/lib/index.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        if (typeof marked !== 'undefined' && typeof markedKatex !== 'undefined') {
            try {
                marked.use(markedKatex({ throwOnError: false }));
            } catch (e) {
                console.warn('Math rendering extension failed to initialize:', e);
            }
        } else {
            console.warn('marked.js or its KaTeX extension failed to load from the CDN — math rendering will be disabled, but the rest of the app will still work.');
        }

        // marked-katex-extension only recognizes $...$ and $$...$$ delimiters.
        // A lot of model output uses the LaTeX-style \( ... \) and \[ ... \]
        // delimiters instead, which silently fail to render without this.
        // Converting them to $ / $$ before handing text to marked() fixes that.
        function normalizeMathDelimiters(text) {
            if (!text) return text;
            return text
                .replace(/\\\[([\s\S]*?)\\\]/g, (_, expr) => `$$${expr}$$`)
                .replace(/\\\(([\s\S]*?)\\\)/g, (_, expr) => `$${expr}$`);
        }

        // Nexus-spark indicator (replaces the old 8-petal flower). Shown wherever
        // the old blinking text cursor used to appear while a response streams.
        // Used identically by both Chat mode and Code mode.
        //
        // This is a DOM-node factory, not a plain string, because the indicator
        // now needs to survive being reclassed between "thinking" and "listening"
        // mid-turn (see the assistant_message handler below) — if it were baked
        // into the HTML string that setProse() re-parses on every streamed token,
        // its CSS animation would restart from frame 0 on every single token.
        // Gradient/filter ids get a unique suffix per instance so two indicators
        // (e.g. an old one mid-removal, a new one for the next turn) never clash.
        let thinkingIndicatorInstanceCount = 0;
        function createThinkingIndicator(state) {
            thinkingIndicatorInstanceCount++;
            const uid = `ti${thinkingIndicatorInstanceCount}`;
            const wrapper = document.createElement('span');
            wrapper.className = 'thinking-indicator';
            wrapper.innerHTML = `<div class="logo-container state-${state}">
        <svg class="ai-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="grad-primary-${uid}" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#8b5cf6" />
                    <stop offset="50%" stop-color="#6366f1" />
                    <stop offset="100%" stop-color="#06b6d4" />
                </linearGradient>
                <linearGradient id="grad-secondary-${uid}" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ec4899" />
                    <stop offset="50%" stop-color="#f43f5e" />
                    <stop offset="100%" stop-color="#f59e0b" />
                </linearGradient>
                <filter id="glow-${uid}" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>
            <circle cx="50" cy="50" r="35" fill="url(#grad-primary-${uid})" opacity="0.1" filter="blur(10px)" class="core-dot"/>
            <g class="spark-group spark-secondary">
                <path d="M 50 12 Q 50 50 88 50 Q 50 50 50 88 Q 50 50 12 50 Q 50 50 50 12 Z"
                      fill="none" stroke="url(#grad-secondary-${uid})" stroke-width="1.5" opacity="0.8" />
                <path d="M 50 15 Q 50 50 85 50 Q 50 50 50 85 Q 50 50 15 50 Q 50 50 50 15 Z"
                      fill="url(#grad-secondary-${uid})" opacity="0.3" style="mix-blend-mode: screen;" />
            </g>
            <g class="spark-group spark-primary">
                <path d="M 50 5 Q 50 50 95 50 Q 50 50 50 95 Q 50 50 5 50 Q 50 50 50 5 Z"
                      fill="url(#grad-primary-${uid})" filter="url(#glow-${uid})" opacity="0.9" />
                <path d="M 50 15 Q 50 50 85 50 Q 50 50 50 85 Q 50 50 15 50 Q 50 50 50 15 Z"
                      fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.5" />
            </g>
            <circle cx="50" cy="50" r="4.5" fill="#ffffff" class="core-dot" filter="url(#glow-${uid})" />
        </svg>
    </div>`;
            return wrapper;
        }

        // Small version of the same Nexus-spark logo, running the "thinking" spin
        // (exact same keyframes/colors as think-spin-primary/secondary/core below),
        // sized to sit inside the round .assistant-avatar slot next to each
        // assistant message — replaces the old plain box-outline icon.
        function createAvatarLogo() {
            thinkingIndicatorInstanceCount++;
            const uid = `av${thinkingIndicatorInstanceCount}`;
            const avatar = document.createElement('div');
            avatar.className = 'assistant-avatar';
            avatar.innerHTML = `<div class="logo-container state-thinking">
        <svg class="ai-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="grad-primary-${uid}" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#8b5cf6" />
                    <stop offset="50%" stop-color="#6366f1" />
                    <stop offset="100%" stop-color="#06b6d4" />
                </linearGradient>
                <linearGradient id="grad-secondary-${uid}" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ec4899" />
                    <stop offset="50%" stop-color="#f43f5e" />
                    <stop offset="100%" stop-color="#f59e0b" />
                </linearGradient>
                <filter id="glow-${uid}" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>
            <circle cx="50" cy="50" r="35" fill="url(#grad-primary-${uid})" opacity="0.1" filter="blur(10px)" class="core-dot"/>
            <g class="spark-group spark-secondary">
                <path d="M 50 12 Q 50 50 88 50 Q 50 50 50 88 Q 50 50 12 50 Q 50 50 50 12 Z"
                      fill="none" stroke="url(#grad-secondary-${uid})" stroke-width="1.5" opacity="0.8" />
                <path d="M 50 15 Q 50 50 85 50 Q 50 50 50 85 Q 50 50 15 50 Q 50 50 50 15 Z"
                      fill="url(#grad-secondary-${uid})" opacity="0.3" style="mix-blend-mode: screen;" />
            </g>
            <g class="spark-group spark-primary">
                <path d="M 50 5 Q 50 50 95 50 Q 50 50 50 95 Q 50 50 5 50 Q 50 50 50 5 Z"
                      fill="url(#grad-primary-${uid})" filter="url(#glow-${uid})" opacity="0.9" />
                <path d="M 50 15 Q 50 50 85 50 Q 50 50 50 85 Q 50 50 15 50 Q 50 50 50 15 Z"
                      fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.5" />
            </g>
            <circle cx="50" cy="50" r="4.5" fill="#ffffff" class="core-dot" filter="url(#glow-${uid})" />
        </svg>
    </div>`;
            return avatar;
        }

        // Switches an existing indicator node's state in place (rather than
        // recreating it) so the CSS transitions already defined on .spark-group /
        // .core-dot / .ai-svg (0.5s) actually get to play between states.
        function setThinkingIndicatorState(indicatorEl, state) {
            const logo = indicatorEl && indicatorEl.querySelector('.logo-container');
            if (!logo) return;
            logo.classList.remove('state-thinking', 'state-listening');
            logo.classList.add(`state-${state}`);
        }

        function highlightCode(el) {
            el.querySelectorAll('pre code').forEach(codeEl => {
                hljs.highlightElement(codeEl);
                const pre = codeEl.parentElement;
                if (pre.parentElement.classList.contains('code-card')) return;

                const langClass = [...codeEl.classList].find(c => c.startsWith('language-'));
                const lang = langClass ? langClass.replace('language-', '') : 'text';
                const isSvg = lang === 'svg' || codeEl.textContent.trim().startsWith('<svg');

                const card = document.createElement('div');
                card.className = 'code-card';
                card.dataset.lang = lang;
                const header = document.createElement('div');
                header.className = 'code-card-header';

                const copyBtnHtml = `
                    <button class="copy-btn" type="button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        <span>Copy</span>
                    </button>
                `;

                let previewDiv = null;

                if (isSvg) {
                    header.innerHTML = `
                        <div class="artifact-tabs">
                            <button class="artifact-tab active" type="button" data-tab="preview">Preview</button>
                            <button class="artifact-tab" type="button" data-tab="code">Code</button>
                        </div>
                        ${copyBtnHtml}
                    `;
                    previewDiv = document.createElement('div');
                    previewDiv.className = 'artifact-preview';
                    previewDiv.innerHTML = DOMPurify.sanitize(codeEl.textContent, { USE_PROFILES: { svg: true, svgFilters: true } });
                    pre.hidden = true;

                    const tabs = header.querySelectorAll('.artifact-tab');
                    tabs.forEach(tab => {
                        tab.addEventListener('click', () => {
                            tabs.forEach(t => t.classList.remove('active'));
                            tab.classList.add('active');
                            const showPreview = tab.dataset.tab === 'preview';
                            previewDiv.hidden = !showPreview;
                            pre.hidden = showPreview;
                        });
                    });
                } else {
                    header.innerHTML = `<span class="code-card-lang">${lang}</span>${copyBtnHtml}`;
                }

                const copyBtn = header.querySelector('.copy-btn');
                const copyLabel = copyBtn.querySelector('span');
                copyBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(codeEl.textContent);
                    copyLabel.textContent = 'Copied!';
                    setTimeout(() => { copyLabel.textContent = 'Copy'; }, 1500);
                });

                pre.parentNode.insertBefore(card, pre);
                card.appendChild(header);
                if (previewDiv) card.appendChild(previewDiv);
                card.appendChild(pre);
            });
        }

        // Remove fenced code blocks from the prose stream; code is rendered in the
        // in-response diff box instead. Also handles the LIVE, still-streaming case:
        // while a `FILE: path` header or its fence hasn't closed yet, the raw code
        // (which is often a full HTML document with its own <style>/<body> tags)
        // must never reach marked.parse() — marked passes raw HTML straight through,
        // so an unstripped mid-stream chunk gets injected directly into the page
        // DOM (e.g. a stray <body style="background:#000"> rendering as a giant
        // black block in the middle of the chat). Everything from the first
        // still-open FILE:/fence marker onward is dropped rather than shown.
        function stripCodeFence(text) {
            if (!text) return text;
            // Drop each closed `FILE: path` header together with its fenced block,
            // as one unit — mirrors the backend's named-file extraction pattern, so
            // the header line isn't left behind as orphaned prose.
            let cleaned = text.replace(/(?:^|\n)[ \t]*FILE\s*:\s*[^\n]+\n[ \t]*```[\w+#.-]*\n[\s\S]*?```/gi, '');
            // Drop any remaining closed, unnamed fenced block too.
            cleaned = cleaned.replace(/```[\w+#.-]*\n[\s\S]*?```/g, '');
            // Anything left that starts a FILE: header or a fence marker is
            // necessarily still open/unclosed — every fully closed pair or bare
            // block was already removed above — so truncate right before it
            // rather than ever rendering it raw.
            const openMarker = cleaned.search(/(?:^|\n)[ \t]*FILE\s*:|```/i);
            if (openMarker !== -1) cleaned = cleaned.slice(0, openMarker);
            return cleaned.trim();
        }

        function renderPlanCard(container, plan) {
            if (!plan || (!plan.summary && (!plan.files || !plan.files.length))) return;
            const card = document.createElement('div');
            card.className = 'plan-card';
            const filesHtml = (plan.files || []).map(name =>
                `<span class="plan-file-chip">${escapeHtml(name)}</span>`
            ).join('');
            card.innerHTML = `
                <div class="plan-card-header">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                    <span>Plan</span>
                </div>
                ${plan.summary ? `<div class="plan-card-summary">${escapeHtml(plan.summary)}</div>` : ''}
                ${filesHtml ? `<div class="plan-card-files">${filesHtml}</div>` : ''}
            `;
            if (plan.files && plan.files.length) {
                const suggestions = document.createElement('div');
                suggestions.className = 'plan-suggestions';
                const mainFile = plan.files[0];
                const quickAsks = [
                    `Add another image to ${mainFile}`,
                    'Adjust the design',
                ];
                quickAsks.forEach(ask => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'plan-suggestion-btn';
                    btn.textContent = ask;
                    btn.addEventListener('click', () => {
                        if (isWaitingForResponse) return;
                        userInput.value = ask;
                        autoResize(userInput);
                        sendMessage();
                    });
                    suggestions.appendChild(btn);
                });
                card.appendChild(suggestions);
            }
            const prose = container.querySelector('.message-prose');
            if (prose) container.insertBefore(card, prose);
            else container.appendChild(card);
            scrollToBottom();
        }

        const API_BASE = 'https://ailoops.onrender.com';

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // ---------- Mode state: Chat and Code keep fully independent
        // sessions, transcripts, and opening-scene text. Switching modes
        // just swaps which one is visible; nothing is destroyed. ----------
        const MODE_COPY = {
            chat: { title: 'How can I help?', subtitle: 'Clear answers, one direct pass', placeholder: 'Ask anything...' },
            code: { title: 'What do you want to build?', subtitle: 'Code with reasoning, previewed instantly', placeholder: 'Describe the code you need...' }
        };
        const modes = {
            chat: { sessionId: generateUUID(), html: '', hasMessages: false },
            code: { sessionId: generateUUID(), html: '', hasMessages: false }
        };
        let currentMode = 'chat';
        let isWaitingForResponse = false;
        // Whether the view should keep auto-scrolling as new content streams in.
        // True as long as the user is at (or near) the bottom; false the instant
        // they scroll up to read something — same as ChatGPT, so a streaming
        // answer never yanks them back down against their will.
        let isPinnedToBottom = true;

        const sidebar = document.getElementById('sidebar');
        const chatContainer = document.getElementById('chatContainer');
        const chatContent = document.getElementById('chatContent');
        const scrollToBottomBtn = document.getElementById('scrollToBottomBtn');
        const openingScene = document.getElementById('openingScene');
        const openingTitle = document.getElementById('openingTitle');
        const openingSubtitle = document.getElementById('openingSubtitle');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const modeToggle = document.getElementById('modeToggle');
        const chatSettings = document.getElementById('chatSettings');
        const codeSettings = document.getElementById('codeSettings');
        function toggleSidebar() { sidebar.classList.toggle('collapsed'); }

        // ============== MODEL / EFFORT PICKER ==============
        // #modelType / #tempSetting / #codeModel / #codeReasoningLevel (down in the
        // composer, hidden) remain the single source of truth sendMessage() reads —
        // this picker only renders their current state and writes back to them.
        // Code mode uses Claude-like layout: main panel shows current model + Effort + More models flyout.
        const MODEL_OPTIONS = {
            chat: [
                { value: 'fast', name: 'Horus', desc: 'Fastest for quick answers' },
                { value: 'balanced', name: 'Osiris', desc: 'Most efficient for everyday tasks' },
                { value: 'reasoning', name: 'Amun-Ra', desc: 'For complex requests' }
            ],
            code: [
                { value: 'fast', name: 'Gemma', desc: 'Gemma-4 — fastest, best for quick edits' },
                { value: 'medium', name: 'Muse Glimmer', desc: 'MetaAI — balanced speed and quality' },
                { value: 'strong', name: 'Nemotron Ultra', desc: 'nvidia/nemotron-3-ultra-550b-a55b — strongest, best for hard problems' }
            ]

        // Claude-style catalog for Code mode only — all except Gemma are Strong + long-horizon

        function updateModelPickerLabel() {
            // Code mode uses CODE_MODEL_CATALOG, Chat uses MODEL_OPTIONS — keeps Claude-like names while chat unchanged
            const field = activeModelField();
            let match = null;

        function renderModelList() {

        function openModelPicker() {

            modelPickerWrap.hidden = true;

        function handleOutsidePickerClick(e) {
            if (!modelPicker.contains(e.target)) closeModelPicker();

        function toggleModelPicker(e) {
            e.stopPropagation();

        function autoResize(textarea) {

            textarea.style.height = (textarea.scrollHeight) + 'px';
            if (textarea.value === '') textarea.style.height = 'auto';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function refreshOpeningSceneVisibility() {
            const state = modes[currentMode];
            if (state.hasMessages) {
                openingScene.style.display = 'none';
                chatContent.style.display = 'flex';
            } else {
                openingScene.style.display = 'flex';
                chatContent.style.display = 'none';
            }
        }

        function switchMode(mode) {
            if (mode === currentMode || isWaitingForResponse) return;

            // Persist the current mode's transcript before swapping.
            modes[currentMode].html = chatContent.innerHTML;

            currentMode = mode;
            modeToggle.classList.toggle('code-active', mode === 'code');
            modeToggle.querySelectorAll('button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            chatSettings.hidden = mode !== 'chat';
            codeSettings.hidden = mode !== 'code';
            closeModelPicker();
            updateModelPickerLabel();

            const copy = MODE_COPY[mode];
            openingTitle.style.opacity = 0;
            openingSubtitle.style.opacity = 0;
            setTimeout(() => {
                openingTitle.textContent = copy.title;
                openingSubtitle.textContent = copy.subtitle;
                openingTitle.style.opacity = 1;
                openingSubtitle.style.opacity = 1;
            }, 150);
            userInput.placeholder = copy.placeholder;

            chatContent.classList.add('mode-fade-out');
            setTimeout(() => {
                chatContent.innerHTML = modes[mode].html;
                refreshOpeningSceneVisibility();
                chatContent.classList.remove('mode-fade-out');
                chatContent.classList.add('mode-fade-in');
                scrollToBottom(true);
                setTimeout(() => chatContent.classList.remove('mode-fade-in'), 260);

        }

        function startNewChat() {
            modes[currentMode].sessionId = generateUUID();
            modes[currentMode].html = '';
            modes[currentMode].hasMessages = false;

            chatContent.innerHTML = '';

            const historyList = document.getElementById('historyList');

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function appendMessage(role, text) {
            modes[currentMode].hasMessages = true;
            openingScene.style.display = 'none';
            chatContent.style.display = 'flex';

            const row = document.createElement('div');
            row.className = `message-row ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            if (role === 'assistant') {
                const avatar = createAvatarLogo();

                const body = document.createElement('div');
                body.className = 'assistant-body';

                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-text';
                // Prose is kept in its own child so streamed updates do not replace
                // the Code mode diff box or the thinking panel.
                contentDiv.innerHTML = `<div class="message-prose">${text ? DOMPurify.sanitize(marked.parse(normalizeMathDelimiters(text))) : ''}</div>`;
                if (text) highlightCode(contentDiv.querySelector('.message-prose'));

                // Thinking block starts EMPTY and expanded. It is only ever populated
                // with real user-facing progress summaries from the backend,
                // and it stays open + growing until the first actual answer token
                // arrives — exactly like Claude: think first, then answer.
                // Identical wiring is used for both Chat mode and Code mode.
                const statusDiv = document.createElement('div');
                statusDiv.className = 'thinking-block';
                statusDiv.style.display = 'none'; // hidden until we actually get a thought
                statusDiv.innerHTML = `
                    <button type="button" class="thinking-toggle">Thinking</button>
                    <div class="thinking-content expanded"></div>
                `;
                statusDiv.querySelector('.thinking-toggle').addEventListener('click', () => {

                if (currentMode === 'code') {

                    workflow.setAttribute('aria-live', 'polite');
                    workflow.innerHTML = `

                    const fileCards = document.createElement('section');
                    fileCards.className = 'response-file-cards';
                    fileCards.hidden = true;
                    fileCards.innerHTML = `

                            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8m0 0 3-3m-3 3L5 7"/><path d="M2.5 11v1.5A1.5 1.5 0 0 0 4 14h8a1.5 1.5 0 0 0 1.5-1.5V11"/></svg>
                            Download all
